<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Lucia's Adventures</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
body{font-family:'Baloo 2',system-ui,-apple-system,sans-serif;color:#3b2a5a;background:#e0f2fe}
button{font-family:inherit;cursor:pointer;color:inherit;border:none;background:none}
#app{position:fixed;inset:0}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;overflow:hidden;padding:10px}
.stage{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5vmin;position:relative;min-height:0}
svg{display:block}

/* backgrounds */
.title{background:radial-gradient(circle at 50% 30%,#f0f9ff,#bae6fd 60%,#c4b5fd)}
.intro{background:radial-gradient(circle at 50% 35%,#e0f2fe,#7dd3fc 55%,#6366f1)}
.map{background:linear-gradient(#c7d2fe 0 30%,#f1f5f9 30%,#e2e8f0)}
.palace{background:linear-gradient(#e0f2fe,#bae6fd 64%,#f0f9ff 64%,#dbeafe)}
.snowhill{background:linear-gradient(#c7d2fe,#e0e7ff 48%,#fff 48%,#e2e8f0)}
.garden{background:linear-gradient(#fdf4ff,#fae8ff 50%,#bbf7d0 50%,#86efac)}
.cave{background:radial-gradient(circle at 50% 40%,#64748b,#1e293b);color:#fff}
.tower{background:radial-gradient(circle at 50% 15%,#eff6ff,#93c5fd 60%,#6366f1)}
.finale{background:radial-gradient(circle at 50% 30%,#fff7d6,#ffd6f0 50%,#bae6fd)}

/* shared */
.topbar{width:100%;display:flex;align-items:center;gap:2vmin;z-index:5}
.topbar+.stage,.topbar+.mapwrap{margin-top:clamp(52px,9vmin,76px)}
.ttl{flex:1;text-align:center;font-weight:800;font-size:clamp(20px,4.2vmin,38px);line-height:1.1}
.ib{width:min(13vmin,72px);height:min(13vmin,72px);border-radius:50%;background:#ffffffd9;font-size:min(6.5vmin,36px);box-shadow:0 4px 0 #0002;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ib svg{width:86%;height:86%}
.big{font-size:clamp(22px,4.4vmin,42px);font-weight:800;padding:.35em 1.4em;border-radius:999px;background:#6366f1;color:#fff;box-shadow:0 6px 0 #4338ca}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #4338ca}
.pill{font-size:clamp(16px,3vmin,24px);font-weight:700;padding:.3em 1.1em;border-radius:999px;background:#fff;color:#3b2a5a;box-shadow:0 4px 0 #0002}
#cap{position:fixed;left:50%;top:calc(min(13vmin,72px) + 18px);transform:translateX(-50%);max-width:min(92vw,760px);background:#fffffff2;color:#3b2a5a;border-radius:18px;padding:6px 18px;font-size:clamp(15px,2.8vmin,24px);font-weight:600;line-height:1.25;text-align:center;opacity:0;transition:opacity .3s;pointer-events:none;z-index:40;box-shadow:0 4px 14px #0003}
#cap.on{opacity:1}
.overlay{position:fixed;inset:0;background:#1e1b4ba6;display:flex;align-items:center;justify-content:center;z-index:50}
.wincard{background:#fff;border-radius:32px;padding:4vmin 6vmin;display:flex;flex-direction:column;align-items:center;gap:2vmin;animation:popin .45s;color:#3b2a5a}
.wincard .row{display:flex;align-items:flex-end;gap:3vmin}
.itemBig{font-size:min(22vmin,150px);line-height:1;animation:glow 1.5s infinite,bob 2s infinite}
.wincard .md{width:min(14vmin,100px)}
.wincard h3{font-size:clamp(22px,4.5vmin,40px)}
.panel{background:#fff;border-radius:24px;padding:24px 28px;display:flex;flex-direction:column;gap:16px;min-width:300px;font-size:19px;color:#3b2a5a}
.panel h2{font-size:26px}
.panel select{font-size:19px;padding:2px 8px;font-family:inherit}
.panel input{width:22px;height:22px;vertical-align:middle;margin-right:6px}
.conf{position:fixed;top:-24px;width:12px;height:18px;z-index:60;pointer-events:none;border-radius:3px;animation:fall linear forwards}
.wiggle{animation:wig .5s}
.area{display:flex;flex-direction:column;align-items:center;gap:3.5vmin;z-index:1}
.glow{box-shadow:0 0 0 6px #ffd34d,0 0 34px #ffd34d!important}

/* title & intro */
.title h1{text-align:center;line-height:.9}
.title h1 span{display:block;font-size:min(16vmin,124px);color:#6366f1;text-shadow:0 5px 0 #fff}
.title h1 small{display:block;font-size:min(6vmin,44px);color:#0284c7}
.cast{display:flex;align-items:flex-end;gap:3vmin}
.cast>div{animation:bob 3s infinite}
.cast>div:nth-child(2){animation-delay:.4s}.cast>div:nth-child(3){animation-delay:.8s}
.cast{gap:1.5vmin}.cast .w0{width:min(22vmin,160px)}.cast .w1{width:min(21vmin,150px)}.cast .w2{width:min(19vmin,140px)}.cast .w3{width:min(12vmin,90px)}.cast .w4{width:min(15vmin,110px)}
.gear{position:absolute;top:10px;right:10px;z-index:6}
.intro .stage{margin-top:min(22vmin,160px)}
.introcast{display:flex;align-items:flex-end;gap:1.5vmin}
.introcast .a{width:min(22vmin,160px)}
.introcast .f{width:min(19vmin,140px);position:relative}
.introcast .m{width:min(12vmin,90px);animation:bob 2.6s infinite}
.introcast .ab{width:min(20vmin,150px);animation:bob 3s infinite}
.introcast .em{width:min(14vmin,100px);animation:bob 3.3s infinite}
.introtxt{font-size:clamp(18px,3.4vmin,30px);text-align:center;max-width:80vw;font-weight:800;color:#fff;text-shadow:0 2px 0 #4338ca}
.tranced svg{filter:saturate(.55) hue-rotate(180deg) brightness(1.02)}
.icebox{position:absolute;inset:-5% -8%;border-radius:18px;background:linear-gradient(135deg,#e0f2fe66,#93c5fd33);border:3px solid #fff;box-shadow:inset 0 0 20px #fff;transition:opacity 1.2s}
.awake .icebox{opacity:0}

/* map */
.mapwrap{position:relative;flex:1;width:100%}
.path{position:absolute;inset:0;width:100%;height:100%}
.path polyline{fill:none;stroke:#6366f1;stroke-width:7;stroke-dasharray:2 16;stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:.6}
.stop{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;z-index:2}
.orb{width:min(17vmin,112px);height:min(17vmin,112px);border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:min(9vmin,58px);box-shadow:0 6px 0 #0002;border:5px solid #818cf8;position:relative}
.stop.locked .orb{filter:grayscale(1);opacity:.6}
.stop.next .orb{animation:pulse 1.6s infinite}
.lbl{margin-top:.6vmin;background:#ffffffe0;border-radius:999px;padding:0 1.4vmin;font-weight:800;font-size:clamp(13px,2.6vmin,22px);white-space:nowrap}
.orb .g{position:absolute;right:-14%;top:-14%;font-size:min(6vmin,38px)}
.flyer{position:absolute;pointer-events:none;z-index:3}
.flyer>div{animation:bob 2.5s infinite;display:flex;align-items:flex-end}
.flyer .fa{width:min(18vmin,126px)}.flyer .fm{width:min(7vmin,50px);margin-left:-2vmin;margin-bottom:4vmin}
.bag{position:absolute;left:1vmin;bottom:1vmin;display:flex;align-items:flex-end;gap:1.5vmin;background:#ffffffd0;border-radius:24px;padding:1vmin 2vmin;z-index:4}
.bag .mi{width:min(14vmin,92px)}
.slots{display:flex;gap:1.2vmin;padding-bottom:1vmin}
.slot{width:min(9vmin,56px);height:min(9vmin,56px);border-radius:12px;border:3px dashed #a5b4fc;display:flex;align-items:center;justify-content:center;background:#fff8;font-size:min(6vmin,38px)}

/* dance */
.stars{display:flex;gap:1.5vmin;font-size:min(8vmin,50px);color:#fff;text-shadow:0 2px 0 #4338ca}
.stars .on{color:#ffd34d}
.rinkrow{display:flex;align-items:flex-end;gap:5vmin}
.rinkrow .anw{width:min(20vmin,150px)}.rinkrow .emw{width:min(14vmin,100px)}
.dancer{width:min(26vmin,195px);height:min(39vmin,292px);transform-origin:50% 100%}
.dancer svg{width:100%;height:100%}
.dancer.spin{animation:spin .7s}.dancer.jump{animation:jump .6s}.dancer.bow{animation:bowa .7s}.dancer.leap{animation:leap .8s}
.poses{display:flex;gap:3vmin;flex-wrap:wrap;justify-content:center}
.pose{width:min(18vmin,124px);height:min(18vmin,124px);border-radius:28px;font-size:min(8.5vmin,54px);color:#fff;box-shadow:0 6px 0 #0003;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;transition:transform .15s,filter .15s}
.pose small{font-size:min(3.5vmin,22px);font-weight:800;margin-top:.6vmin}
.pose.lit{transform:scale(1.16);filter:brightness(1.25);box-shadow:0 0 0 6px #fff,0 0 34px #fff}

/* memory */
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:2vmin}
.card{width:min(16vmin,124px);height:min(20vmin,156px);position:relative;perspective:600px}
.cb,.cf{position:absolute;inset:0;border-radius:16px;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .35s}
.cb{background:linear-gradient(135deg,#818cf8,#38bdf8);font-size:min(7vmin,44px);border:4px solid #fff;box-shadow:0 5px 0 #0002}
.cf{background:#fff;transform:rotateY(180deg);border:4px solid #a5b4fc}
.cf svg{width:86%;height:86%}
.card.up .cb{transform:rotateY(180deg)}
.card.up .cf{transform:rotateY(0)}
.card.matched .cf{border-color:#4ade80;box-shadow:0 0 18px #4ade80}

/* snowball math */
.prog{display:flex;gap:1.6vmin}
.pdot{width:max(2.6vmin,14px);height:max(2.6vmin,14px);border-radius:50%;background:#ffffff99;border:2px solid #6366f1}
.pdot.on{background:#ffd34d}
.tank{display:flex;align-items:center;justify-content:center;gap:3vmin;flex-wrap:wrap;width:100%;position:relative;min-height:26vmin}
.tenframe{display:grid;grid-template-columns:repeat(5,auto);gap:1.6vmin;justify-content:center}
.obj{position:relative}
.snow{width:min(9.5vmin,64px);height:min(9.5vmin,64px);border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#eef2ff 60%,#c7d2fe);border:2px solid #fff;box-shadow:0 4px 0 #94a3b8}
.obj.counted::after{content:attr(data-n);position:absolute;top:-8px;right:-8px;background:#6366f1;color:#fff;border-radius:50%;width:1.7em;height:1.7em;display:flex;align-items:center;justify-content:center;font-size:clamp(13px,2.8vmin,22px);font-weight:800;border:2px solid #fff}
.obj.popped{animation:pop .5s forwards;pointer-events:none}
.pilebox{display:flex;flex-direction:column;align-items:center;gap:1vmin}
.pilebox .face{width:min(12vmin,80px)}
.plus{font-size:min(11vmin,72px);font-weight:800;color:#6366f1}
.pile{display:flex;flex-direction:column;align-items:center;gap:1vmin;background:#ffffffaa;border-radius:24px;padding:2vmin;border:4px solid #fff;box-shadow:0 6px 0 #0001}
.pile .face{width:min(13vmin,86px)}
.pile .snow{width:min(7.5vmin,50px);height:min(7.5vmin,50px)}
.pile.right{border-color:#4ade80;background:#dcfce7}
.answers{display:flex;gap:3.5vmin;flex-wrap:wrap;justify-content:center}
.num{min-width:min(17vmin,112px);padding:1.2vmin 2vmin;border-radius:24px;background:#fff;box-shadow:0 6px 0 #0002;color:#3b2a5a}
.num b{font-size:min(10vmin,64px);display:block;line-height:1}
.dots{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;justify-items:center;margin-top:6px}
.dots i{width:max(1.7vmin,9px);height:max(1.7vmin,9px);border-radius:50%;background:#6366f1;display:block}
.num.right,.numcard.right{background:#bbf7d0}
.numcard{font-size:min(13vmin,90px);font-weight:800;background:#fff;border-radius:24px;width:min(18vmin,120px);height:min(21vmin,140px);box-shadow:0 6px 0 #0002;color:#3b2a5a;line-height:1}
.peek{position:absolute;right:1vmin;bottom:-2vmin;width:min(14vmin,96px);animation:peek 1s}

/* garden: phonics */
.maddieside{position:absolute;left:2vmin;bottom:1vmin;width:min(13vmin,96px);pointer-events:none;animation:bob 3s infinite;z-index:0}
.abbyside{position:absolute;right:2vmin;bottom:1vmin;width:min(22vmin,160px);pointer-events:none;animation:bob 3.4s infinite;z-index:0}
.phonart{width:min(30vmin,210px);height:min(30vmin,210px);background:#fff;border-radius:28px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 #0001;border:5px solid #f0abfc}
.phonart svg{width:80%;height:90%}
.phonart .emo{font-size:min(19vmin,130px);line-height:1}
.ltiles{display:flex;gap:4vmin}
.ltile{width:min(18vmin,120px);height:min(18vmin,120px);border-radius:50%;background:radial-gradient(#fff 58%,#f9a8d4 59%);font-size:min(10vmin,66px);font-weight:800;color:#7c3aed;box-shadow:0 6px 0 #0002}
.ltile.right{background:radial-gradient(#fff 58%,#4ade80 59%)}

/* tracing */
.name{display:flex;gap:1.5vmin}
.name span{width:min(10vmin,64px);height:min(10vmin,64px);border-radius:16px;background:#ffffffaa;color:#6366f199;font-size:min(7vmin,44px);font-weight:800;display:flex;align-items:center;justify-content:center;border:3px dashed #6366f199}
.name span.cur{border-color:#6366f1;color:#6366f1;border-style:solid}
.name span.got{background:#ec4899;color:#fff;border-style:solid;border-color:#fff}
.name.done span{animation:jump .7s}
.board{position:relative;width:min(70vw,46vh);height:min(70vw,46vh);border-radius:24px;background:#ffffffcc}
.board.paper{background:#fffaf0 repeating-linear-gradient(transparent 0 30px,#fbcfe8 30px 32px);border:5px solid #f9a8d4;box-shadow:0 8px 20px #0002}
.guide{position:absolute;inset:0;width:100%;height:100%}
.guide .g1{fill:none;stroke:#c084fc44;stroke-width:13;stroke-linecap:round;stroke-linejoin:round}
.guide .g2{fill:none;stroke:#a855f7;stroke-width:1.2;stroke-dasharray:2.5 3;stroke-linecap:round}
.guide .start{fill:#4ade80;stroke:#fff;stroke-width:1.2}
.guide.hint .start{animation:blink .6s 3}
.guide text.n{font-size:5.5px;fill:#14532d;font-weight:800;text-anchor:middle;dominant-baseline:central}
.guide text.t{font-size:7px;fill:#a855f7;font-weight:700;text-anchor:middle}
.guide.gold .g1{stroke:#ffd34d}
.board canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.carrier{position:absolute;left:50%;top:-12%;width:28%;transform:translateX(-50%);z-index:3}
.carrier>div{animation:dropin .8s}
.board.sending{transition:transform 1.1s ease-in,opacity 1.1s;transform:translateY(-55vh) scale(.08) rotate(25deg);opacity:.3}

/* cave */
.kids4{display:flex;flex-wrap:wrap;gap:2.5vmin;justify-content:center;max-width:96vw}
.kidbtn{background:#ffffff22;border:4px solid #ffffff66;border-radius:24px;padding:1.5vmin;width:min(21vmin,160px)}
.kids2 .kidbtn{width:min(28vmin,200px)}
.kidbtn svg{width:100%;height:auto;animation:bob 2.4s infinite}
.kidbtn:nth-child(2) svg{animation-delay:.4s}.kidbtn:nth-child(3) svg{animation-delay:.8s}.kidbtn:nth-child(4) svg{animation-delay:1.2s}
.kidbtn.right{border-color:#4ade80;background:#4ade8044}
.kids2{display:flex;gap:5vmin}
.cavespider{position:absolute;top:-2vmin;width:min(10vmin,64px);animation:bob 2.8s infinite;pointer-events:none}
.patrow{display:flex;gap:1.8vmin;padding:2vmin 3vmin;background:#ffffff33;border-radius:999px}
.crys{width:min(10vmin,66px);height:min(10vmin,66px);clip-path:polygon(50% 0,100% 40%,50% 100%,0 40%)}
.crys.q{clip-path:none;border-radius:50%;background:#fff;border:4px dashed #c084fc;display:flex;align-items:center;justify-content:center;font-size:min(7vmin,44px);color:#c084fc;font-weight:800}
.patopts{display:flex;gap:5vmin}
.patopts .crys{width:min(15vmin,100px);height:min(15vmin,100px)}

/* tower */
.bosstop{position:absolute;left:2vmin;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:2.5vmin;z-index:2;pointer-events:none}
.fahwrap{position:relative;width:min(17vmin,124px)}
.tower .board{width:min(64vw,42vh);height:min(64vw,42vh)}
.tower .name span{width:min(8.5vmin,54px);height:min(8.5vmin,54px)}
.meter{display:flex;gap:1vmin}
.meter i{width:min(6vmin,36px);height:min(6vmin,36px);border-radius:8px;background:#bae6fd;border:3px solid #fff;display:block;transition:all .5s;box-shadow:0 3px 0 #0002}
.meter i.off{opacity:.15;transform:scale(.6)}
.bossarea{display:flex;flex-direction:column;align-items:center;gap:2.5vmin;flex:1;justify-content:center}
.flakecount{font-size:min(8vmin,52px);font-weight:800;color:#fff;text-shadow:0 3px 0 #4338ca}
.flake{position:absolute;top:-14vmin;width:min(13vmin,84px);animation:flakefall linear forwards;z-index:6}
.flake .fi.melt{animation:melt .4s forwards}
.palette{display:flex;gap:2vmin;align-items:center;flex-wrap:wrap;justify-content:center}
.palette .pc{width:min(9vmin,56px);height:min(9vmin,56px);border-radius:50%;border:4px solid #fff;box-shadow:0 3px 0 #0002}
.palette .pc.sel{transform:scale(1.2);box-shadow:0 0 0 4px #3b2a5a}

/* game room + map spider */
.groomscr{background:radial-gradient(circle at 50% 20%,#fdf2f8,#f5d0fe 55%,#c4b5fd)}
.ggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2.5vmin}
.gcard{width:min(24vmin,170px);height:min(19vmin,130px);border-radius:24px;background:#fff;box-shadow:0 6px 0 #0002;display:flex;flex-direction:column;align-items:center;justify-content:center;border:4px solid #f9a8d4}
.gcard span{font-size:min(9vmin,56px);line-height:1}
.gcard b{font-size:clamp(13px,2.6vmin,21px);line-height:1.1;margin-top:.6vmin;text-align:center}
.grhost{position:absolute;top:-2vmin;right:2vmin;width:min(12vmin,80px);animation:bob 2.6s infinite;pointer-events:none}
.emmeline{position:absolute;top:0;right:3vmin;width:min(13vmin,86px);display:flex;flex-direction:column;align-items:center;z-index:5;animation:bob 2.6s infinite}
.emmeline .thread{width:2px;height:4vmin;background:#fff}
.emmeline svg{width:100%}
.emmeline span{background:#ec4899;color:#fff;font-weight:800;border-radius:999px;padding:0 1.2vmin;font-size:clamp(12px,2.3vmin,18px);white-space:nowrap;box-shadow:0 3px 0 #0002}
.replay{position:absolute;right:2vmin;bottom:2vmin;z-index:6}
.title .groom{margin-top:-1vmin}

/* finale */
.party{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:2vmin;max-width:96vw}
.pc2{width:min(11vmin,86px);animation:dance .9s ease-in-out infinite}.pc2.wide{width:min(17vmin,124px)}
.btns{display:flex;gap:3vmin;flex-wrap:wrap;justify-content:center;align-items:center}
.heartbig{font-size:min(20vmin,140px);line-height:1;animation:glow 1.5s infinite,bob 2.5s infinite}

/* keyframes */
@keyframes spin{0%,50%,100%{transform:scaleX(1)}25%,75%{transform:scaleX(-1)}}
@keyframes jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-28%)}}
@keyframes bowa{0%,100%{transform:rotate(0)}50%{transform:rotate(14deg) scaleY(.9)}}
@keyframes leap{0%,100%{transform:translate(0,0)}35%{transform:translate(28%,-18%) rotate(10deg)}70%{transform:translate(-8%,-4%)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes wig{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px) rotate(-3deg)}40%{transform:translateX(10px) rotate(3deg)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35);opacity:.7}100%{transform:scale(0);opacity:0}}
@keyframes peek{0%{transform:translateX(120%)}100%{transform:translateX(0)}}
@keyframes fall{to{transform:translateY(112vh) rotate(720deg)}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 6px #fff)}50%{filter:drop-shadow(0 0 22px #e0f2fe)}}
@keyframes popin{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes blink{50%{opacity:.2}}
@keyframes dance{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-14%) rotate(6deg)}}
@keyframes flakefall{to{transform:translateY(calc(100vh + 28vmin)) rotate(220deg)}}
@keyframes melt{to{transform:scale(1.6);opacity:0}}

/* ===== combined app additions ===== */
/* bookshelf */

<script>
'use strict';
const app=document.getElementById('app'), cap=document.getElementById('cap');

/* ---------- helpers ---------- */
function h(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }
const rnd=n=>Math.floor(Math.random()*n);
const randInt=(a,b)=>a+rnd(b-a+1);
const shuffle=arr=>{ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; };
function wiggle(el){ el.classList.remove('wiggle'); void el.offsetWidth; el.classList.add('wiggle'); }
let timers=[];
function T(fn,ms){ const id=setTimeout(fn,ms); timers.push(id); return id; }

/* ---------- saved state (shared settings + per-story progress) ---------- */
const STORY_IDS=['jewel','ice','noni'];
const SAYOPTS={
  'Fah-fah':['Fa fa','Fah fah','Fa-fa','Faa faa','Fafa','Fahh fahh','Faw faw'],
  'Noni':['Noni','No-nee','Noh nee','Nonny'],
  'Jame':['Jaym','Jame','Jaim','Jay m'],
  'Baboj':['Bah-bodge','Bah-boshe','Bah-bohzh','Bah-boge']
};
let S={ mathMax:10, voice:true, says:{}, prog:{} };
try{ const d=JSON.parse(localStorage.getItem('luciaAdventures')||'null'); if(d) S=Object.assign(S,d); }catch(e){}
Object.keys(SAYOPTS).forEach(k=>{ if(!S.says[k]) S.says[k]=SAYOPTS[k][0]; });
function save(){ try{ localStorage.setItem('luciaAdventures',JSON.stringify(S)); }catch(e){} }
let CUR='jewel';
const ST=()=>STORIES[CUR];
function P(id){ id=id||CUR; const n=STORIES[id].worlds.length-1; let p=S.prog[id];
  if(!p||!Array.isArray(p.items)||p.items.length!==n){ p=S.prog[id]={items:Array(n).fill(false),won:false,seenIntro:false}; }
  return p; }
function resetStory(id){ id=id||CUR; S.prog[id]=null; P(id); save(); }
const capi=s=>s.charAt(0).toUpperCase()+s.slice(1);

/* ---------- sound ---------- */
let AC=null;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended'){ try{AC.resume();}catch(e){} } return AC; }
function tone(freq,dur,when,type,vol){
  const a=ac(); if(!a) return; dur=dur||0.15; when=when||0; vol=vol||0.16;
  const o=a.createOscillator(), g=a.createGain(); o.type=type||'sine'; o.frequency.value=freq;
  const t=a.currentTime+when; g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+0.05);
}
const sfx={
  yay(){ [523,659,784,1047].forEach((f,i)=>tone(f,0.28,i*0.09,'triangle')); },
  oops(){ tone(330,0.18,0); tone(262,0.28,0.15); },
  tap(){ tone(880,0.07,0,'sine',0.08); },
  note(i){ tone([523,659,784,988][i%4],0.35,0,'triangle',0.2); },
  pop(){ tone(900,0.08,0,'square',0.05); tone(500,0.08,0.05,'square',0.04); },
  chime(){ tone(1568,0.25,0,'sine',0.1); tone(2093,0.3,0.06,'sine',0.07); },
  sparkle(){ for(let i=0;i<6;i++) tone(1200+Math.random()*900,0.12,i*0.05,'sine',0.06); }
};
const TUNES={ice:[659,587,523,587,659,659,659,0,587,587,587,0,659,784,784],jewel:[523,523,784,784,880,880,784,0,698,698,659,659,587,587,523],noni:[523,523,523,587,659,0,659,587,659,698,784]};
function music(name){ const m=TUNES[name]||TUNES.ice; m.forEach((f,i)=>{ if(f){ tone(f,0.3,i*0.28,'triangle',0.14); if(i%2===0) tone(f/2,0.3,i*0.28,'sine',0.08); } }); }

/* ---------- voice ---------- */
// How names are spoken (the screen still shows the normal spelling).
const PRONOUNCE=[[/\bGr{2,}\b/gi,'Gurrrr'],[/\bGr{2,}\b/gi,'Gurrr'],[/\bLucia\b/g,'Loo-see-uh'],[/\bJJ\b/g,'Jay Jay'],[/\bMs\. Anwar\b/g,'Miss Anwar']];
let voiceObj=null, sayId=0, capTimer=null, instr='';
// Pick one good English voice and stick with it, so the voice never switches mid-game.
const NOVELTY=/Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Deranged|Good News|Hysterical|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Fred|Junior|Ralph|Kathy|Grandma|Grandpa|Eddy|Flo|Reed|Rocko|Sandy|Shelley|Novelty/i;
function englishVoices(){ try{ return speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)&&!NOVELTY.test(v.name)); }catch(e){ return []; } }
function voiceScore(v){ let s=0, n=v.name;
  if(/en[-_]US/i.test(v.lang)) s+=3;
  if(/Premium/i.test(n)) s+=8; else if(/Enhanced/i.test(n)) s+=6;

    let nx=-(b[1]-a[1])/L, ny=(b[0]-a[0])/L; const mx=(a[0]+b[0])/2-cx, my=(a[1]+b[1])/2-cy; if(nx*mx+ny*my<0){ nx=-nx; ny=-ny; }

/* ---------- reusable games ---------- */
function numChoices(c,max){
  const s=new Set([c]); let tries=0;
  while(s.size<3&&tries<60){ tries++; const d=c+(rnd(2)?1:-1)*randInt(1,2); if(d>=1&&d<=Math.max(max,c+1)) s.add(d); }
  let k=1; while(s.size<3){ s.add(k); k++; }
  return [...s].sort((x,y)=>x-y);
}

    const b=btns[i]; b.classList.add('lit'); setTimeout(()=>b.classList.remove('lit'),420); sfx.note(i); }
  function playSeq(text){ locked=true; input=[];
    instruct(text,()=>{ seq.forEach((p,k)=>T(()=>doPose(p),400+k*950)); T(()=>{ locked=false; say('Your turn!'); },400+seq.length*950+200); }); }
  function newRound(){ seq=Array.from({length:LEN[round]},()=>rnd(4)); playSeq(round===0?firstIntro:`Now a longer dance, with ${LEN[round]} moves. Watch!`); }
  btns.forEach((b,i)=>b.onclick=()=>{

// tracing board
function arcPts(cx,cy,rx,ry,a0,a1,n){ const p=[]; for(let i=0;i<=n;i++){ const t=a0+(a1-a0)*i/n; p.push([+(cx+rx*Math.cos(t)).toFixed(1),+(cy+ry*Math.sin(t)).toFixed(1)]); } return p; }
function heartPts(){ const p=[]; for(let i=0;i<=48;i++){ const t=-2*Math.PI*i/48; const x=16*Math.pow(Math.sin(t),3), y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t); p.push([+(50+x*2.4).toFixed(1),+(52-y*2.4).toFixed(1)]); } return p; }
const LETTERS={
  L:[[[30,15],[30,85],[72,85]]],
  U:[[[28,15],[28,60]].concat(arcPts(50,60,22,22,Math.PI,0,14).slice(1)).concat([[72,15]])],
  C:[arcPts(52,50,32,32,-Math.PI/4,-7*Math.PI/4,24)],
  I:[[[50,15],[50,85]],[[34,15],[66,15]],[[34,85],[66,85]]],
  O:[arcPts(50,50,25,34,-Math.PI/2,-5*Math.PI/2,28)],
  V:[[[25,15],[50,85],[75,15]]],
  E:[[[68,15],[32,15],[32,85],[68,85]],[[32,50],[62,50]]],
  F:[[[68,15],[32,15],[32,85]],[[32,50],[60,50]]],
  A:[[[25,85],[50,15],[75,85]],[[36,58],[64,58]]],
  H:[[[30,15],[30,85]],[[70,15],[70,85]],[[30,50],[70,50]]],
  HEART:[heartPts()]
};
function densify(pts,step){ const out=[pts[0]]; for(let i=1;i<pts.length;i++){ const [x0,y0]=pts[i-1],[x1,y1]=pts[i]; const n=Math.max(1,Math.round(Math.hypot(x1-x0,y1-y0)/step)); for(let k=1;k<=n;k++) out.push([x0+(x1-x0)*k/n,y0+(y1-y0)*k/n]); } return out; }
function boardHTML(cls){ return `<div class="board ${cls||''}"><svg class="guide" viewBox="0 0 100 100"></svg><canvas></canvas></div>`; }
function makeTracer(board,pass){
  const guide=board.querySelector('.guide'), cv=board.querySelector('canvas'), ctx=cv.getContext('2d');
  let cps=[], hit=[], inkTotal=0, inkOff=0, last=null, drawing=false, active=false, mode='trace', color='#ec4899', onDone=null;
  function size(){ const r=board.getBoundingClientRect(), d=window.devicePixelRatio||1; cv.width=Math.round(r.width*d); cv.height=Math.round(r.height*d); ctx.setTransform(d,0,0,d,0,0); ctx.lineCap='round'; ctx.lineJoin='round'; }
  function clear(){ ctx.clearRect(0,0,cv.width,cv.height); hit=cps.map(()=>false); inkTotal=0; inkOff=0; last=null; }
  function pos(e){ const r=board.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width*100,y:(e.clientY-r.top)/r.height*100,px:e.clientX-r.left,py:e.clientY-r.top,w:r.width}; }
  function test(x,y){ if(mode!=='trace'){ inkTotal++; return; } let m=1e9; for(let i=0;i<cps.length;i++){ const d=Math.hypot(cps[i][0]-x,cps[i][1]-y); if(d<m) m=d; if(d<10) hit[i]=true; } inkTotal++; if(m>15) inkOff++; }
  function ink(p){
    const lw=mode==='trace'?p.w*0.075:p.w*0.03;
    ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=lw; ctx.shadowColor=mode==='trace'?'#fff':'transparent'; ctx.shadowBlur=mode==='trace'?10:0;
    if(last){ ctx.beginPath(); ctx.moveTo(last.px,last.py); ctx.lineTo(p.px,p.py); ctx.stroke();
      const steps=Math.max(1,Math.ceil(Math.hypot(p.x-last.x,p.y-last.y)/2)); for(let k=1;k<=steps;k++) test(last.x+(p.x-last.x)*k/steps,last.y+(p.y-last.y)*k/steps); }
    else { ctx.beginPath(); ctx.arc(p.px,p.py,lw/2,0,Math.PI*2); ctx.fill(); test(p.x,p.y); }
    last=p;
  }
  function check(){
    const frac=hit.filter(Boolean).length/hit.length;
    if(frac>=(pass||0.92)){ active=false; guide.classList.add('gold'); if(onDone) onDone(); }
    else if(inkTotal>30&&inkOff/inkTotal>0.4){ sfx.oops(); say("Oops, let's stay on the line. Try again!"); clear(); }
  }
  cv.addEventListener('pointerdown',e=>{ if(!active) return; e.preventDefault(); try{ cv.setPointerCapture(e.pointerId); }catch(_){} drawing=true; last=null; ink(pos(e)); });
  cv.addEventListener('pointermove',e=>{ if(!drawing||!active) return; e.preventDefault(); ink(pos(e)); });
  const up=()=>{ if(!drawing) return; drawing=false; last=null; if(mode==='trace') check(); };
  cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
  return {
    load(strokes,cb){ mode='trace'; color='#ec4899'; onDone=cb; active=true; cps=[]; strokes.forEach(s=>densify(s,4).forEach(p=>cps.push(p)));
      const pl=s=>s.map(p=>p.join(',')).join(' ');
      guide.classList.remove('gold');
      guide.innerHTML=strokes.map(s=>`<polyline class="g1" points="${pl(s)}"/>`).join('')+strokes.map(s=>`<polyline class="g2" points="${pl(s)}"/>`).join('')
        +strokes.map((s,i)=>`<circle class="start" cx="${s[0][0]}" cy="${s[0][1]}" r="5"/><text class="n" x="${s[0][0]}" y="${s[0][1]}">${i+1}</text>`).join('');
      size(); clear(); },
    free(guideMarkup){ mode='free'; active=true; cps=[]; guide.classList.remove('gold'); guide.innerHTML=guideMarkup||''; size(); clear(); },
    setColor(c){ color=c; },
    get ink(){ return inkTotal; },
    hint(){ guide.classList.remove('hint'); void guide.offsetWidth; guide.classList.add('hint'); },
    resize(){ size(); clear(); }
  };
}
function traceSeq(area,keys,slotLabels,boardCls,intros,onEach,onAll,pass){
  area.innerHTML=`<div class="name">${slotLabels.map(c=>`<span>${c}</span>`).join('')}</div>${boardHTML(boardCls)}`;
  const slots=area.querySelector('.name'), tr=makeTracer(area.querySelector('.board'),pass); let i=0;
  window.onresize=()=>tr.resize();
  function next(){
    [...slots.children].forEach((s,k)=>s.classList.toggle('cur',k===i));
    instruct(intros(keys[i],i));
    tr.load(LETTERS[keys[i]],()=>{
      sfx.yay(); slots.children[i].classList.add('got'); slots.children[i].classList.remove('cur'); const key=keys[i]; i++;
      if(i<keys.length) say(onEach(key),()=>T(next,300));
      else { slots.classList.add('done'); onAll(key); }
    });
  }
  currentHint=()=>{ tr.hint(); say('Put your finger on the green dot with number one, and follow the line, nice and slow.'); };
  next();
}

  const x=randInt(1,M-1); let y; do{ y=randInt(1,M); }while(y===x); r.push({t:'more',x,y});
  const n=randInt(4,M), p=randInt(1,Math.min(3,n-1)); r.push({t:'sub',n,p});
  a=randInt(2,M-2); b=randInt(1,Math.min(4,M-a)); r.push({t:'add',a,b,spider:true});

const PALETTE=['#ec4899','#ef4444','#a855f7','#3b82f6','#22c55e','#f59e0b'];
function levelTower(only){
  const el=shell('tower',only==='melt'?'Melt the Snowflakes':only==='letter'?'Draw a Letter':'Frozen Tower'); const st=el.querySelector('.stage');
  st.innerHTML=`<div class="bosstop"><div class="fahwrap tranced"><div class="fsvg">${fahSVG(true)}</div><div class="icebox"></div></div><div class="meter"><i></i><i></i><i></i></div></div><div class="bossarea"></div>`;
  show(el);
  const area=st.querySelector('.bossarea'), meter=[...st.querySelectorAll('.meter i')], fw=st.querySelector('.fahwrap');
  let phase=0;
  const crack=()=>{ if(meter[phase]) meter[phase].classList.add('off'); phase++; sfx.sparkle(); };

  function frost(){
    const GOAL=10; let melted=0, live=0, stopped=false;
    area.innerHTML=`<div class="flakecount">❄️ <b>0</b> / ${GOAL}</div>`;
    const cnt=area.querySelector('b');
    instruct("Fah-fah is in a frosty trance, and she's sending snowflakes! Tap the snowflakes to melt them. Melt ten!");
    function spawn(){
      if(stopped) return;
      if(live<4){
        live++;
        const f=h(`<div class="flake"><div class="fi">${flakeSVG()}</div></div>`);
        f.style.left=(4+Math.random()*80)+'%'; f.style.animationDuration=(5.5+Math.random()*3)+'s';
        const gone=()=>{ if(f.parentNode){ f.remove(); live--; } };
        f.addEventListener('animationend',e=>{ if(e.target===f) gone(); });
        f.addEventListener('pointerdown',()=>{
          if(f.classList.contains('hit')||stopped) return;
          f.classList.add('hit'); f.querySelector('.fi').classList.add('melt'); melted++; cnt.textContent=melted; sfx.chime(); say(String(melted)); setTimeout(gone,400);
          if(melted>=GOAL){ stopped=true; setTimeout(()=>{ st.querySelectorAll('.flake').forEach(x=>x.remove()); live=0; },420); crack();
            if(only==='melt') say('You melted all the frost!',()=>T(()=>complete(4),300)); else say("You melted all the frost! Now let's write Fah-fah a letter.",()=>T(write,300)); }
        });
        st.appendChild(f);
      }
      T(spawn,650+Math.random()*600);
    }
    T(spawn,2500);
    currentHint=()=>say('Tap the falling snowflakes with your finger, before they float away!');
  }

  function write(){
    traceSeq(area,['F','A','H','HEART'],['F','A','H','♥'],'paper',
      (k,i)=>i===0?'Dear Fah-fah! First write her name. Trace the letter F, starting at the green dot.':k==='HEART'?'Now draw a big heart for Fah-fah! Start at the green dot and go all the way around.':`Now trace the letter ${k}.`,
      k=>k==='H'?'F, A, H. Fah-fah!':`The letter ${k}!`,
      ()=>{ crack(); say('A beautiful heart! Look, Fah-fah is starting to wake up!',()=>T(decorate,300)); });
  }

  function decorate(){
    area.innerHTML=`${boardHTML('paper')}<div class="palette">${PALETTE.map((c,i)=>`<button class="pc ${i?'':'sel'}" style="background:${c}" data-c="${c}"></button>`).join('')}<button class="big send">💌 Send</button></div>`;
    const board=area.querySelector('.board'), tr=makeTracer(board);
    tr.free(`<text class="t" x="50" y="12">Dear Fah-fah,</text><text class="t" x="50" y="93">Love, Lucia ♥</text>`);
    tr.setColor(PALETTE[0]);
    window.onresize=()=>tr.resize();
    area.querySelectorAll('.pc').forEach(b=>b.onclick=()=>{ sfx.tap(); area.querySelectorAll('.pc').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); tr.setColor(b.dataset.c); });
    area.querySelector('.send').onclick=()=>{
      if(tr.ink<15){ sfx.oops(); say('Draw something on your letter first! Hearts, flowers, anything you like.'); return; }
      area.querySelector('.palette').style.visibility='hidden';
      board.appendChild(h(`<div class="carrier"><div>${spiderSVG('#ec4899',true,true)}</div></div>`));
      say("Princess Emmeline's spider will carry your letter up to Fah-fah!");
      T(()=>{ board.classList.add('sending'); sfx.sparkle(); },1600);
      T(()=>{ crack(); fw.classList.remove('tranced'); fw.classList.add('awake'); fw.querySelector('.fsvg').innerHTML=fahSVG(false); confetti(); sfx.yay();
        say("Fah-fah wakes up! She says: Thank you, Lucia! I love my letter!",()=>T(()=>complete(4),600)); },2900);
    };
    instruct('Now decorate your letter! Pick a color and draw anything you like for Fah-fah. Then tap Send.');
    currentHint=()=>say('Draw hearts, flowers, stars, or a picture of you and Fah-fah. Then tap Send!');
  }
  if(only==='letter') decorate(); else frost();
}

function jPool(){
  const el=shell('pool','The Pool'); const st=el.querySelector('.stage');
  st.innerHTML=`<div class="swimmer">${luciaSVG()}<div class="ring"></div></div><div class="prog"></div><div class="tank"></div><div class="answers"></div>`;
  show(el);
  const M=5, rounds=[];
  rounds.push({type:'count',n:randInt(2,5)}); rounds.push({type:'count',n:randInt(3,5)});
  let a=randInt(1,3), b=randInt(1,Math.min(3,M-a)); rounds.push({type:'add',a,b});
  const n0=randInt(3,5), p0=randInt(1,Math.min(2,n0-1)); rounds.push({type:'sub',n:n0,p:p0});
  a=randInt(1,3); b=randInt(1,Math.min(3,M-a)); rounds.push({type:'add',a,b});
  let r=0;
  const prog=st.querySelector('.prog'), tank=st.querySelector('.tank'), ans=st.querySelector('.answers');
  prog.innerHTML=rounds.map(()=>'<span class="pdot"></span>').join('');
  function run(){
    const R=rounds[r]; let counted=0, hints=0, answer;
    tank.innerHTML=''; ans.innerHTML=''; ans.style.pointerEvents='';
    const mk=(cls,content)=>{ const d=h(`<div class="obj ${cls}">${content}</div>`);
      d.onclick=()=>{ if(d.classList.contains('counted')||d.classList.contains('popped')) return; counted++; d.classList.add('counted'); d.dataset.n=counted; sfx.tap(); say(String(counted)); };
      return d; };
    if(R.type==='count'){
      answer=R.n; const g=h('<div class="group"></div>');
      for(let i=0;i<R.n;i++){ const f=mk('fish',i%2?'🐠':'🐟'); f.style.animationDelay=(-Math.random()*2)+'s'; g.appendChild(f); }
      tank.appendChild(g);
      instruct(r===0?'Lucia is swimming with the fish! How many fish are there? Tap each fish to count.':'How many fish are swimming now?');
    } else if(R.type==='add'){
      answer=R.a+R.b;
      const g1=h('<div class="group"></div>'), g2=h('<div class="group" style="position:relative"></div>');
      for(let i=0;i<R.a;i++) g1.appendChild(mk('bub',''));
      for(let i=0;i<R.b;i++) g2.appendChild(mk('bub pink',''));
      g2.appendChild(h(`<div class="minispider">${spiderSVG()}</div>`));
      tank.append(g1,h('<div class="plus">+</div>'),g2);
      instruct(`Lucia blows ${R.a} bubble${R.a>1?'s':''}. A spider brings ${R.b} more! How many bubbles altogether?`);
    } else {
      answer=R.n-R.p; const g=h('<div class="group"></div>'), bs=[];
      for(let i=0;i<R.n;i++){ const b2=mk('bub',''); bs.push(b2); g.appendChild(b2); }
      tank.append(g,h(`<div class="peek">${kidSVG('elias')}</div>`));
      instruct(`There are ${R.n} bubbles. Uh oh, Elias pops ${R.p}! How many are left?`);
      T(()=>{ for(let k=0;k<R.p;k++) bs[R.n-1-k].classList.add('popped'); sfx.pop(); },2600);
    }
    numChoices(answer,M).forEach(v=>{
      const btn=h(`<button class="num" data-v="${v}"><b>${v}</b><div class="dots">${'<i></i>'.repeat(v)}</div></button>`);
      btn.onclick=()=>{
        if(v===answer){ sfx.yay(); btn.classList.add('right'); ans.style.pointerEvents='none'; prog.children[r].classList.add('on'); r++;
          say(`Yes! ${v}!`); T(()=>r>=rounds.length?complete(1):run(),1900); }
        else { sfx.oops(); wiggle(btn); say('Not quite. Tap each one to count!'); }
      };
      ans.appendChild(btn);
    });
    currentHint=()=>{ hints++;
      if(hints>=2){ const c=[...ans.children].find(x=>+x.dataset.v===answer); if(c) c.classList.add('glow'); say('Emmy thinks it is this one!'); }
      else say('Emmy says: touch each one and count out loud. One, two, three!'); };
  }
  run();
}

      T(()=>{ confetti(); sfx.yay(); say("Sparkle, sparkle! With her blue elephant and Grumpa's magic spaghetti, Princess Emmeline turned into a real girl! She is Lucia's little sister!",()=>T(()=>complete(3),800)); },2800); };
  }
  if(only==='cook') cook(); else calm();
}

  el.querySelector('.home').onclick=()=>{ sfx.tap(); showTitle(); };
  el.querySelector('.again').onclick=()=>say(instr);
  el.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{ sfx.tap(); showGameRoom(b.dataset.id); });
  el.querySelectorAll('.gcard').forEach(b=>b.onclick=()=>{ sfx.tap(); CUR=roomTab; FREE=true; freeGame=GAMES[roomTab][+b.dataset.i]; freeGame.go(); });

/* ---------- grown-ups ---------- */
function grownups(){
  const ov=h(`<div class="overlay"><div class="panel"><h2>Grown-ups</h2>
<label>Math numbers up to <select class="mm"><option value="5">5</option><option value="10">10</option></select><br><small>(Ice Queen and Noni-Gumpa; the Magic Jewel stays at 5)</small></label>
<label><input type="checkbox" class="vo">Read everything out loud</label>
<div><b>Voice</b><div class="sayrow"><select class="vsel" style="max-width:230px"></select><button class="pill vhear">🔊</button></div></div>
<div><b>How the voice says names</b>${Object.keys(SAYOPTS).map(k=>`<div class="sayrow"><span>${k}</span><select data-k="${k}">${SAYOPTS[k].map(o=>`<option>${o}</option>`).join('')}</select><button class="pill hear" data-k="${k}">🔊</button></div>`).join('')}</div>
<div><b>Start a story over</b><div class="resets">${STORY_IDS.map(id=>`<button class="pill rs" data-id="${id}">${STORIES[id].short}</button>`).join('')}</div></div>
<button class="big close">Done</button></div></div>`);
  document.body.appendChild(ov);
  const mm=ov.querySelector('.mm'), vo=ov.querySelector('.vo');
  mm.value=String(S.mathMax); mm.onchange=()=>{ S.mathMax=+mm.value; save(); };
  vo.checked=S.voice; vo.onchange=()=>{ S.voice=vo.checked; save(); };
  const vsel=ov.querySelector('.vsel');
  const fillVoices=()=>{ const vs=englishVoices().sort((a,b)=>voiceScore(b)-voiceScore(a));
    vsel.innerHTML='<option value="auto">Automatic (best available)</option>'+vs.map(v=>`<option value="${v.name.replace(/"/g,'&quot;')}">${v.name} (${v.lang})</option>`).join('');
    vsel.value=S.voiceName&&vs.some(v=>v.name===S.voiceName)?S.voiceName:'auto'; };
  fillVoices(); if(!englishVoices().length) setTimeout(fillVoices,600);
  vsel.onchange=()=>{ S.voiceName=vsel.value; save(); voiceObj=null; loadVoices(); say("Hi Lucia! Do you like my voice?"); };
  ov.querySelector('.vhear').onclick=()=>say("Hi Lucia! Do you like my voice?");
  ov.querySelectorAll('select[data-k]').forEach(sel=>{ const k=sel.dataset.k; sel.value=S.says[k]; sel.onchange=()=>{ S.says[k]=sel.value; save(); say(k); }; });
  ov.querySelectorAll('.hear').forEach(b=>b.onclick=()=>say(`Hi ${b.dataset.k}!`));
  ov.querySelectorAll('.rs').forEach(b=>{ let armed=false; b.onclick=()=>{
    if(!armed){ armed=true; b.textContent='Tap again to reset'; return; }
    resetStory(b.dataset.id); b.textContent='✓ Reset'; }; });
  ov.querySelector('.close').onclick=()=>{ ov.remove(); showTitle(); };
}
