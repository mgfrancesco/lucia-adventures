<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lucia">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ec4899">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Lucia's Adventures</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
body{font-family:'Baloo 2',system-ui,-apple-system,sans-serif;color:#3b2a5a;background:#e0f2fe}
button{font-family:inherit;cursor:pointer;color:inherit;border:none;background:none}
#app{position:fixed;inset:0}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;overflow:hidden;padding:10px}
.stage{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5vmin;position:relative;min-height:0}
svg{display:block}

/* backgrounds */
.title{background:radial-gradient(circle at 50% 30%,#f0f9ff,#bae6fd 60%,#c4b5fd)}
.intro{background:radial-gradient(circle at 50% 35%,#e0f2fe,#7dd3fc 55%,#6366f1)}
.map{background:linear-gradient(#c7d2fe 0 30%,#f1f5f9 30%,#e2e8f0)}
.palace{background:linear-gradient(#e0f2fe,#bae6fd 64%,#f0f9ff 64%,#dbeafe)}
.snowhill{background:linear-gradient(#c7d2fe,#e0e7ff 48%,#fff 48%,#e2e8f0)}
.garden{background:linear-gradient(#fdf4ff,#fae8ff 50%,#bbf7d0 50%,#86efac)}
.cave{background:radial-gradient(circle at 50% 40%,#64748b,#1e293b);color:#fff}
.tower{background:radial-gradient(circle at 50% 15%,#eff6ff,#93c5fd 60%,#6366f1)}
.finale{background:radial-gradient(circle at 50% 30%,#fff7d6,#ffd6f0 50%,#bae6fd)}

/* shared */
.topbar{width:100%;display:flex;align-items:center;gap:2vmin;z-index:5}
.topbar+.stage,.topbar+.mapwrap{margin-top:clamp(52px,9vmin,76px)}
.ttl{flex:1;text-align:center;font-weight:800;font-size:clamp(20px,4.2vmin,38px);line-height:1.1}
.ib{width:min(13vmin,72px);height:min(13vmin,72px);border-radius:50%;background:#ffffffd9;font-size:min(6.5vmin,36px);box-shadow:0 4px 0 #0002;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ib svg{width:86%;height:86%}
.big{font-size:clamp(22px,4.4vmin,42px);font-weight:800;padding:.35em 1.4em;border-radius:999px;background:#6366f1;color:#fff;box-shadow:0 6px 0 #4338ca}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #4338ca}
.pill{font-size:clamp(16px,3vmin,24px);font-weight:700;padding:.3em 1.1em;border-radius:999px;background:#fff;color:#3b2a5a;box-shadow:0 4px 0 #0002}
#cap{position:fixed;left:50%;top:calc(min(13vmin,72px) + 18px);transform:translateX(-50%);max-width:min(92vw,760px);background:#fffffff2;color:#3b2a5a;border-radius:18px;padding:6px 18px;font-size:clamp(15px,2.8vmin,24px);font-weight:600;line-height:1.25;text-align:center;opacity:0;transition:opacity .3s;pointer-events:none;z-index:40;box-shadow:0 4px 14px #0003}
#cap.on{opacity:1}
.overlay{position:fixed;inset:0;background:#1e1b4ba6;display:flex;align-items:center;justify-content:center;z-index:50}
.wincard{background:#fff;border-radius:32px;padding:4vmin 6vmin;display:flex;flex-direction:column;align-items:center;gap:2vmin;animation:popin .45s;color:#3b2a5a}
.wincard .row{display:flex;align-items:flex-end;gap:3vmin}
.itemBig{font-size:min(22vmin,150px);line-height:1;animation:glow 1.5s infinite,bob 2s infinite}
.wincard .md{width:min(14vmin,100px)}
.wincard h3{font-size:clamp(22px,4.5vmin,40px)}
.panel{background:#fff;border-radius:24px;padding:24px 28px;display:flex;flex-direction:column;gap:16px;min-width:300px;font-size:19px;color:#3b2a5a}
.panel h2{font-size:26px}
.panel select{font-size:19px;padding:2px 8px;font-family:inherit}
.panel input{width:22px;height:22px;vertical-align:middle;margin-right:6px}
.conf{position:fixed;top:-24px;width:12px;height:18px;z-index:60;pointer-events:none;border-radius:3px;animation:fall linear forwards}
.wiggle{animation:wig .5s}
.area{display:flex;flex-direction:column;align-items:center;gap:3.5vmin;z-index:1}
.glow{box-shadow:0 0 0 6px #ffd34d,0 0 34px #ffd34d!important}

/* title & intro */
.title h1{text-align:center;line-height:.9}
.title h1 span{display:block;font-size:min(16vmin,124px);color:#6366f1;text-shadow:0 5px 0 #fff}
.title h1 small{display:block;font-size:min(6vmin,44px);color:#0284c7}
.cast{display:flex;align-items:flex-end;gap:3vmin}
.cast>div{animation:bob 3s infinite}
.cast>div:nth-child(2){animation-delay:.4s}.cast>div:nth-child(3){animation-delay:.8s}
.cast{gap:1.5vmin}.cast .w0{width:min(22vmin,160px)}.cast .w1{width:min(21vmin,150px)}.cast .w2{width:min(19vmin,140px)}.cast .w3{width:min(12vmin,90px)}.cast .w4{width:min(15vmin,110px)}
.gear{position:absolute;top:10px;right:10px;z-index:6}
.intro .stage{margin-top:min(22vmin,160px)}
.introcast{display:flex;align-items:flex-end;gap:1.5vmin}
.introcast .a{width:min(22vmin,160px)}
.introcast .f{width:min(19vmin,140px);position:relative}
.introcast .m{width:min(12vmin,90px);animation:bob 2.6s infinite}
.introcast .ab{width:min(20vmin,150px);animation:bob 3s infinite}
.introcast .em{width:min(14vmin,100px);animation:bob 3.3s infinite}
.introtxt{font-size:clamp(18px,3.4vmin,30px);text-align:center;max-width:80vw;font-weight:800;color:#fff;text-shadow:0 2px 0 #4338ca}
.tranced svg{filter:saturate(.55) hue-rotate(180deg) brightness(1.02)}
.icebox{position:absolute;inset:-5% -8%;border-radius:18px;background:linear-gradient(135deg,#e0f2fe66,#93c5fd33);border:3px solid #fff;box-shadow:inset 0 0 20px #fff;transition:opacity 1.2s}
.awake .icebox{opacity:0}

/* map */
.mapwrap{position:relative;flex:1;width:100%}
.path{position:absolute;inset:0;width:100%;height:100%}
.path polyline{fill:none;stroke:#6366f1;stroke-width:7;stroke-dasharray:2 16;stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:.6}
.stop{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;z-index:2}
.orb{width:min(17vmin,112px);height:min(17vmin,112px);border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:min(9vmin,58px);box-shadow:0 6px 0 #0002;border:5px solid #818cf8;position:relative}
.stop.locked .orb{filter:grayscale(1);opacity:.6}
.stop.next .orb{animation:pulse 1.6s infinite}
.lbl{margin-top:.6vmin;background:#ffffffe0;border-radius:999px;padding:0 1.4vmin;font-weight:800;font-size:clamp(13px,2.6vmin,22px);white-space:nowrap}
.orb .g{position:absolute;right:-14%;top:-14%;font-size:min(6vmin,38px)}
.flyer{position:absolute;pointer-events:none;z-index:3}
.flyer>div{animation:bob 2.5s infinite;display:flex;align-items:flex-end}
.flyer .fa{width:min(18vmin,126px)}.flyer .fm{width:min(7vmin,50px);margin-left:-2vmin;margin-bottom:4vmin}
.bag{position:absolute;left:1vmin;bottom:1vmin;display:flex;align-items:flex-end;gap:1.5vmin;background:#ffffffd0;border-radius:24px;padding:1vmin 2vmin;z-index:4}
.bag .mi{width:min(14vmin,92px)}
.slots{display:flex;gap:1.2vmin;padding-bottom:1vmin}
.slot{width:min(9vmin,56px);height:min(9vmin,56px);border-radius:12px;border:3px dashed #a5b4fc;display:flex;align-items:center;justify-content:center;background:#fff8;font-size:min(6vmin,38px)}

/* dance */
.stars{display:flex;gap:1.5vmin;font-size:min(8vmin,50px);color:#fff;text-shadow:0 2px 0 #4338ca}
.stars .on{color:#ffd34d}
.rinkrow{display:flex;align-items:flex-end;gap:5vmin}
.rinkrow .anw{width:min(20vmin,150px)}.rinkrow .emw{width:min(14vmin,100px)}
.dancer{width:min(26vmin,195px);height:min(39vmin,292px);transform-origin:50% 100%}
.dancer svg{width:100%;height:100%}
.dancer.spin{animation:spin .7s}.dancer.jump{animation:jump .6s}.dancer.bow{animation:bowa .7s}.dancer.leap{animation:leap .8s}
.poses{display:flex;gap:3vmin;flex-wrap:wrap;justify-content:center}
.pose{width:min(18vmin,124px);height:min(18vmin,124px);border-radius:28px;font-size:min(8.5vmin,54px);color:#fff;box-shadow:0 6px 0 #0003;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;transition:transform .15s,filter .15s}
.pose small{font-size:min(3.5vmin,22px);font-weight:800;margin-top:.6vmin}
.pose.lit{transform:scale(1.16);filter:brightness(1.25);box-shadow:0 0 0 6px #fff,0 0 34px #fff}

/* memory */
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:2vmin}
.card{width:min(16vmin,124px);height:min(20vmin,156px);position:relative;perspective:600px}
.cb,.cf{position:absolute;inset:0;border-radius:16px;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .35s}
.cb{background:linear-gradient(135deg,#818cf8,#38bdf8);font-size:min(7vmin,44px);border:4px solid #fff;box-shadow:0 5px 0 #0002}
.cf{background:#fff;transform:rotateY(180deg);border:4px solid #a5b4fc}
.cf svg{width:86%;height:86%}
.card.up .cb{transform:rotateY(180deg)}
.card.up .cf{transform:rotateY(0)}
.card.matched .cf{border-color:#4ade80;box-shadow:0 0 18px #4ade80}

/* snowball math */
.prog{display:flex;gap:1.6vmin}
.pdot{width:max(2.6vmin,14px);height:max(2.6vmin,14px);border-radius:50%;background:#ffffff99;border:2px solid #6366f1}
.pdot.on{background:#ffd34d}
.tank{display:flex;align-items:center;justify-content:center;gap:3vmin;flex-wrap:wrap;width:100%;position:relative;min-height:26vmin}
.tenframe{display:grid;grid-template-columns:repeat(5,auto);gap:1.6vmin;justify-content:center}
.obj{position:relative}
.snow{width:min(9.5vmin,64px);height:min(9.5vmin,64px);border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#eef2ff 60%,#c7d2fe);border:2px solid #fff;box-shadow:0 4px 0 #94a3b8}
.obj.counted::after{content:attr(data-n);position:absolute;top:-8px;right:-8px;background:#6366f1;color:#fff;border-radius:50%;width:1.7em;height:1.7em;display:flex;align-items:center;justify-content:center;font-size:clamp(13px,2.8vmin,22px);font-weight:800;border:2px solid #fff}
.obj.popped{animation:pop .5s forwards;pointer-events:none}
.pilebox{display:flex;flex-direction:column;align-items:center;gap:1vmin}
.pilebox .face{width:min(12vmin,80px)}
.plus{font-size:min(11vmin,72px);font-weight:800;color:#6366f1}
.pile{display:flex;flex-direction:column;align-items:center;gap:1vmin;background:#ffffffaa;border-radius:24px;padding:2vmin;border:4px solid #fff;box-shadow:0 6px 0 #0001}
.pile .face{width:min(13vmin,86px)}
.pile .snow{width:min(7.5vmin,50px);height:min(7.5vmin,50px)}
.pile.right{border-color:#4ade80;background:#dcfce7}
.answers{display:flex;gap:3.5vmin;flex-wrap:wrap;justify-content:center}
.num{min-width:min(17vmin,112px);padding:1.2vmin 2vmin;border-radius:24px;background:#fff;box-shadow:0 6px 0 #0002;color:#3b2a5a}
.num b{font-size:min(10vmin,64px);display:block;line-height:1}
.dots{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;justify-items:center;margin-top:6px}
.dots i{width:max(1.7vmin,9px);height:max(1.7vmin,9px);border-radius:50%;background:#6366f1;display:block}
.num.right,.numcard.right{background:#bbf7d0}
.numcard{font-size:min(13vmin,90px);font-weight:800;background:#fff;border-radius:24px;width:min(18vmin,120px);height:min(21vmin,140px);box-shadow:0 6px 0 #0002;color:#3b2a5a;line-height:1}
.peek{position:absolute;right:1vmin;bottom:-2vmin;width:min(14vmin,96px);animation:peek 1s}

/* garden: phonics */
.maddieside{position:absolute;left:2vmin;bottom:1vmin;width:min(13vmin,96px);pointer-events:none;animation:bob 3s infinite;z-index:0}
.abbyside{position:absolute;right:2vmin;bottom:1vmin;width:min(22vmin,160px);pointer-events:none;animation:bob 3.4s infinite;z-index:0}
.phonart{width:min(30vmin,210px);height:min(30vmin,210px);background:#fff;border-radius:28px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 #0001;border:5px solid #f0abfc}
.phonart svg{width:80%;height:90%}
.phonart .emo{font-size:min(19vmin,130px);line-height:1}
.ltiles{display:flex;gap:4vmin}
.ltile{width:min(18vmin,120px);height:min(18vmin,120px);border-radius:50%;background:radial-gradient(#fff 58%,#f9a8d4 59%);font-size:min(10vmin,66px);font-weight:800;color:#7c3aed;box-shadow:0 6px 0 #0002}
.ltile.right{background:radial-gradient(#fff 58%,#4ade80 59%)}

/* tracing */
.name{display:flex;gap:1.5vmin}
.name span{width:min(10vmin,64px);height:min(10vmin,64px);border-radius:16px;background:#ffffffaa;color:#6366f199;font-size:min(7vmin,44px);font-weight:800;display:flex;align-items:center;justify-content:center;border:3px dashed #6366f199}
.name span.cur{border-color:#6366f1;color:#6366f1;border-style:solid}
.name span.got{background:#ec4899;color:#fff;border-style:solid;border-color:#fff}
.name.done span{animation:jump .7s}
.board{position:relative;width:min(70vw,46vh);height:min(70vw,46vh);border-radius:24px;background:#ffffffcc}
.board.paper{background:#fffaf0 repeating-linear-gradient(transparent 0 30px,#fbcfe8 30px 32px);border:5px solid #f9a8d4;box-shadow:0 8px 20px #0002}
.guide{position:absolute;inset:0;width:100%;height:100%}
.guide .g1{fill:none;stroke:#c084fc44;stroke-width:13;stroke-linecap:round;stroke-linejoin:round}
.guide .g2{fill:none;stroke:#a855f7;stroke-width:1.2;stroke-dasharray:2.5 3;stroke-linecap:round}
.guide .start{fill:#4ade80;stroke:#fff;stroke-width:1.2}
.guide.hint .start{animation:blink .6s 3}
.guide text.n{font-size:5.5px;fill:#14532d;font-weight:800;text-anchor:middle;dominant-baseline:central}
.guide text.t{font-size:7px;fill:#a855f7;font-weight:700;text-anchor:middle}
.guide.gold .g1{stroke:#ffd34d}
.board canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.carrier{position:absolute;left:50%;top:-12%;width:28%;transform:translateX(-50%);z-index:3}
.carrier>div{animation:dropin .8s}
.board.sending{transition:transform 1.1s ease-in,opacity 1.1s;transform:translateY(-55vh) scale(.08) rotate(25deg);opacity:.3}

/* cave */
.kids4{display:flex;flex-wrap:wrap;gap:2.5vmin;justify-content:center;max-width:96vw}
.kidbtn{background:#ffffff22;border:4px solid #ffffff66;border-radius:24px;padding:1.5vmin;width:min(21vmin,160px)}
.kids2 .kidbtn{width:min(28vmin,200px)}
.kidbtn svg{width:100%;height:auto;animation:bob 2.4s infinite}
.kidbtn:nth-child(2) svg{animation-delay:.4s}.kidbtn:nth-child(3) svg{animation-delay:.8s}.kidbtn:nth-child(4) svg{animation-delay:1.2s}
.kidbtn.right{border-color:#4ade80;background:#4ade8044}
.kids2{display:flex;gap:5vmin}
.cavespider{position:absolute;top:-2vmin;width:min(10vmin,64px);animation:bob 2.8s infinite;pointer-events:none}
.patrow{display:flex;gap:1.8vmin;padding:2vmin 3vmin;background:#ffffff33;border-radius:999px}
.crys{width:min(10vmin,66px);height:min(10vmin,66px);clip-path:polygon(50% 0,100% 40%,50% 100%,0 40%)}
.crys.q{clip-path:none;border-radius:50%;background:#fff;border:4px dashed #c084fc;display:flex;align-items:center;justify-content:center;font-size:min(7vmin,44px);color:#c084fc;font-weight:800}
.patopts{display:flex;gap:5vmin}
.patopts .crys{width:min(15vmin,100px);height:min(15vmin,100px)}

/* tower */
.bosstop{position:absolute;left:2vmin;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:2.5vmin;z-index:2;pointer-events:none}
.fahwrap{position:relative;width:min(17vmin,124px)}
.tower .board{width:min(64vw,42vh);height:min(64vw,42vh)}
.tower .name span{width:min(8.5vmin,54px);height:min(8.5vmin,54px)}
.meter{display:flex;gap:1vmin}
.meter i{width:min(6vmin,36px);height:min(6vmin,36px);border-radius:8px;background:#bae6fd;border:3px solid #fff;display:block;transition:all .5s;box-shadow:0 3px 0 #0002}
.meter i.off{opacity:.15;transform:scale(.6)}
.bossarea{display:flex;flex-direction:column;align-items:center;gap:2.5vmin;flex:1;justify-content:center}
.flakecount{font-size:min(8vmin,52px);font-weight:800;color:#fff;text-shadow:0 3px 0 #4338ca}
.flake{position:absolute;top:-14vmin;width:min(13vmin,84px);animation:flakefall linear forwards;z-index:6}
.flake .fi.melt{animation:melt .4s forwards}
.palette{display:flex;gap:2vmin;align-items:center;flex-wrap:wrap;justify-content:center}
.palette .pc{width:min(9vmin,56px);height:min(9vmin,56px);border-radius:50%;border:4px solid #fff;box-shadow:0 3px 0 #0002}
.palette .pc.sel{transform:scale(1.2);box-shadow:0 0 0 4px #3b2a5a}

/* game room + map spider */
.groomscr{background:radial-gradient(circle at 50% 20%,#fdf2f8,#f5d0fe 55%,#c4b5fd)}
.ggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2.5vmin}
.gcard{width:min(24vmin,170px);height:min(19vmin,130px);border-radius:24px;background:#fff;box-shadow:0 6px 0 #0002;display:flex;flex-direction:column;align-items:center;justify-content:center;border:4px solid #f9a8d4}
.gcard span{font-size:min(9vmin,56px);line-height:1}
.gcard b{font-size:clamp(13px,2.6vmin,21px);line-height:1.1;margin-top:.6vmin;text-align:center}
.grhost{position:absolute;top:-2vmin;right:2vmin;width:min(12vmin,80px);animation:bob 2.6s infinite;pointer-events:none}
.emmeline{position:absolute;top:0;right:3vmin;width:min(13vmin,86px);display:flex;flex-direction:column;align-items:center;z-index:5;animation:bob 2.6s infinite}
.emmeline .thread{width:2px;height:4vmin;background:#fff}
.emmeline svg{width:100%}
.emmeline span{background:#ec4899;color:#fff;font-weight:800;border-radius:999px;padding:0 1.2vmin;font-size:clamp(12px,2.3vmin,18px);white-space:nowrap;box-shadow:0 3px 0 #0002}
.replay{position:absolute;right:2vmin;bottom:2vmin;z-index:6}
.title .groom{margin-top:-1vmin}

/* finale */
.party{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:2vmin;max-width:96vw}
.pc2{width:min(11vmin,86px);animation:dance .9s ease-in-out infinite}.pc2.wide{width:min(17vmin,124px)}
.btns{display:flex;gap:3vmin;flex-wrap:wrap;justify-content:center;align-items:center}
.heartbig{font-size:min(20vmin,140px);line-height:1;animation:glow 1.5s infinite,bob 2.5s infinite}

/* keyframes */
@keyframes spin{0%,50%,100%{transform:scaleX(1)}25%,75%{transform:scaleX(-1)}}
@keyframes jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-28%)}}
@keyframes bowa{0%,100%{transform:rotate(0)}50%{transform:rotate(14deg) scaleY(.9)}}
@keyframes leap{0%,100%{transform:translate(0,0)}35%{transform:translate(28%,-18%) rotate(10deg)}70%{transform:translate(-8%,-4%)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes wig{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px) rotate(-3deg)}40%{transform:translateX(10px) rotate(3deg)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35);opacity:.7}100%{transform:scale(0);opacity:0}}
@keyframes peek{0%{transform:translateX(120%)}100%{transform:translateX(0)}}
@keyframes fall{to{transform:translateY(112vh) rotate(720deg)}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 6px #fff)}50%{filter:drop-shadow(0 0 22px #e0f2fe)}}
@keyframes popin{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes blink{50%{opacity:.2}}

<script>
'use strict';
const app=document.getElementById('app'), cap=document.getElementById('cap');

/* ---------- helpers ---------- */
function h(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }
const rnd=n=>Math.floor(Math.random()*n);
const randInt=(a,b)=>a+rnd(b-a+1);
const shuffle=arr=>{ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; };
function wiggle(el){ el.classList.remove('wiggle'); void el.offsetWidth; el.classList.add('wiggle'); }
let timers=[];
function T(fn,ms){ const id=setTimeout(fn,ms); timers.push(id); return id; }

/* ---------- saved state (shared settings + per-story progress) ---------- */
const STORY_IDS=['jewel','ice','noni','witch','alien'];
const SAYOPTS={
  'Fah-fah':['Fa fa','Fah fah','Fa-fa','Faa faa','Fafa','Fahh fahh','Faw faw'],
  'Noni':['Noni','No-nee','Noh nee','Nonny'],
  'Jame':['Jaym','Jame','Jaim','Jay m'],
  'Baboj':['Bah-bodge','Bah-boshe','Bah-bohzh','Bah-boge'],
  'Francesca':['Francesca','Fran-chess-ka','Fran-cheska'],
  'Denadu':['Den-uh-doo','Denna-doo','Den a doo','Den-ah-doo'],
  'Isaline':['Iz-a-leen','Ee-za-leen','Iz-a-line','Is-a-leen']
};
let S={ mathMax:10, voice:true, says:{}, prog:{}, stickers:{}, bedMin:0 };
try{ const d=JSON.parse(localStorage.getItem('luciaAdventures')||'null'); if(d) S=Object.assign(S,d); }catch(e){}
Object.keys(SAYOPTS).forEach(k=>{ if(!S.says[k]) S.says[k]=SAYOPTS[k][0]; });
function save(){ try{ localStorage.setItem('luciaAdventures',JSON.stringify(S)); }catch(e){} }
let CUR='jewel';
const ST=()=>STORIES[CUR];
function P(id){ id=id||CUR; const n=STORIES[id].worlds.length-1; let p=S.prog[id];
  if(!p||!Array.isArray(p.items)||p.items.length!==n){ p=S.prog[id]={items:Array(n).fill(false),won:false,seenIntro:false}; }
  return p; }
function resetStory(id){ id=id||CUR; S.prog[id]=null; P(id); save(); }
const capi=s=>s.charAt(0).toUpperCase()+s.slice(1);

/* ---------- sound ---------- */
let AC=null;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended'){ try{AC.resume();}catch(e){} } return AC; }
function tone(freq,dur,when,type,vol){
  const a=ac(); if(!a) return; dur=dur||0.15; when=when||0; vol=vol||0.16;
  const o=a.createOscillator(), g=a.createGain(); o.type=type||'sine'; o.frequency.value=freq;
  const t=a.currentTime+when; g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+0.05);
}
const sfx={
  yay(){ [523,659,784,1047].forEach((f,i)=>tone(f,0.28,i*0.09,'triangle')); },
  oops(){ tone(330,0.18,0); tone(262,0.28,0.15); },
  tap(){ tone(880,0.07,0,'sine',0.08); },
  note(i){ tone([523,659,784,988][i%4],0.35,0,'triangle',0.2); },
  pop(){ tone(900,0.08,0,'square',0.05); tone(500,0.08,0.05,'square',0.04); },
  chime(){ tone(1568,0.25,0,'sine',0.1); tone(2093,0.3,0.06,'sine',0.07); },
  sparkle(){ for(let i=0;i<6;i++) tone(1200+Math.random()*900,0.12,i*0.05,'sine',0.06); }
};
const TUNES={ice:[659,587,523,587,659,659,659,0,587,587,587,0,659,784,784],jewel:[523,523,784,784,880,880,784,0,698,698,659,659,587,587,523],noni:[523,523,523,587,659,0,659,587,659,698,784],lullaby:[392,392,587,587,659,659,587,0,523,523,494,494,440,440,392],alien:[784,659,784,880,784,659,523,0,587,659,698,659,587,523,784],witch:[440,523,659,587,523,440,0,494,587,698,659,587,523,0,659,880]};
function music(name){ const m=TUNES[name]||TUNES.ice, gap=name==='lullaby'?0.6:0.28, len=name==='lullaby'?0.55:0.3, vol=name==='lullaby'?0.08:0.14; m.forEach((f,i)=>{ if(f){ tone(f,len,i*gap,name==='lullaby'?'sine':'triangle',vol); if(i%2===0) tone(f/2,len,i*gap,'sine',vol*0.6); } }); }

/* ---------- voice ---------- */
// How names are spoken (the screen still shows the normal spelling).
const PRONOUNCE=[[/\bGr{2,}\b/gi,'Gurrrr'],[/\bGr{2,}\b/gi,'Gurrr'],[/\bLucia\b/g,'Loo-see-uh'],[/\bJJ\b/g,'Jay Jay'],[/\bMs\. Anwar\b/g,'Miss Anwar']];
let voiceObj=null, sayId=0, capTimer=null, instr='';
// Pick one good English voice and stick with it, so the voice never switches mid-game.
const NOVELTY=/Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Deranged|Good News|Hysterical|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Fred|Junior|Ralph|Kathy|Grandma|Grandpa|Eddy|Flo|Reed|Rocko|Sandy|Shelley|Novelty/i;
function englishVoices(){ try{ return speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)&&!NOVELTY.test(v.name)); }catch(e){ return []; } }
const FEMALE=/Samantha|Ava|Allison|Susan|Zoe|Nicky|Karen|Moira|Tessa|Fiona|Veena|Serena|Kate|Stephanie|Martha|Catherine|Joelle|Noelle|Victoria|Vicki|Zira|Hazel|Aria|Jenny|Female|Google US English/i;
const MALE=/Aaron|Daniel|Fred|Alex\b|Tom\b|Arthur|Gordon|Oliver|Rishi|Nathan|Evan|Lee\b|Ralph|David|Mark\b|George|Guy\b|\bMale\b|Albert|Junior|Reed|Rocko|Eddy|Grandpa/i;
function voiceScore(v){ let s=0, n=v.name;
  if(MALE.test(n)) s-=20; if(FEMALE.test(n)) s+=10; if(/^Samantha/i.test(n)) s+=3;
  if(/en[-_]US/i.test(v.lang)) s+=3;
  if(/Premium/i.test(n)) s+=4; else if(/Enhanced/i.test(n)) s+=3;
  if(v.localService) s+=1;
  return s; }
function pickVoice(){
  const vs=englishVoices(); if(!vs.length) return null;
  if(S.voiceName&&S.voiceName!=='auto'){ const v=vs.find(v=>v.name===S.voiceName); if(v) return v; }
  return vs.slice().sort((a,b)=>voiceScore(b)-voiceScore(a))[0]; }
function loadVoices(){ const v=pickVoice(); if(v) voiceObj=v; return !!v; }
try{ speechSynthesis.onvoiceschanged=()=>{ loadVoices(); }; }catch(e){}
loadVoices(); { let n=0; const iv=setInterval(()=>{ if(loadVoices()||++n>20) clearInterval(iv); },250); }
function showCaption(t){ cap.textContent=t; cap.classList.add('on'); clearTimeout(capTimer); capTimer=setTimeout(()=>cap.classList.remove('on'),Math.max(3500,t.length*85)); }
function speechText(t){ Object.keys(SAYOPTS).forEach(k=>{ t=t.replace(new RegExp('\\b'+k+'\\b','g'),S.says[k]||SAYOPTS[k][0]); }); PRONOUNCE.forEach(([r,s])=>{ t=t.replace(r,s); }); return t.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu,''); }
let esVoice=null;
function pickES(){ try{ const vs=speechSynthesis.getVoices().filter(v=>/^es/i.test(v.lang)); if(!vs.length) return null; const fem=/Mónica|Monica|Paulina|Marisol|Angélica|Angelica|Soledad|Isabela|Helena|Laura|Lucía|Lucia|Elvira|Paloma|Sabina|Ximena|Female/i; return vs.find(v=>fem.test(v.name))||vs[0]; }catch(e){ return null; } }
function say(text,onend){
  const id=++sayId, plain=text.replace(/\[es:([^\]]+)\]/g,'$1'); showCaption(plain);
  let done=false; const fin=()=>{ if(done) return; done=true; if(id===sayId&&onend) onend(); };
  if(onend) setTimeout(fin,1800+plain.length*95);
  if(!S.voice||!window.speechSynthesis) return;
  try{ const busy=speechSynthesis.speaking||speechSynthesis.pending, parts=[]; let last=0;
    text.replace(/\[es:([^\]]+)\]/g,(m,es,off)=>{ if(off>last) parts.push({t:text.slice(last,off),es:false}); parts.push({t:es,es:true}); last=off+m.length; return m; });
    if(last<text.length) parts.push({t:text.slice(last),es:false});
    if(!voiceObj) loadVoices(); if(!esVoice) esVoice=pickES();

    let nx=-(b[1]-a[1])/L, ny=(b[0]-a[0])/L; const mx=(a[0]+b[0])/2-cx, my=(a[1]+b[1])/2-cy; if(nx*mx+ny*my<0){ nx=-nx; ny=-ny; }

/* ---------- effects ---------- */
function confetti(){
  const cols=['#ec4899','#ffd34d','#4ade80','#60a5fa','#a78bfa','#fb923c','#fff'];
  for(let i=0;i<50;i++){ const d=document.createElement('div'); d.className='conf'; d.style.left=(Math.random()*100)+'vw'; d.style.background=cols[i%cols.length];
    d.style.animationDuration=(1.8+Math.random()*1.6)+'s'; d.style.animationDelay=(Math.random()*0.6)+'s'; document.body.appendChild(d); setTimeout(()=>d.remove(),4500); }
}

/* ---------- reusable games ---------- */
function numChoices(c,max){
  const s=new Set([c]); let tries=0;
  while(s.size<3&&tries<60){ tries++; const d=c+(rnd(2)?1:-1)*randInt(1,2); if(d>=1&&d<=Math.max(max,c+1)) s.add(d); }
  let k=1; while(s.size<3){ s.add(k); k++; }
  return [...s].sort((x,y)=>x-y);
}

// copy-the-dance
const MOVES=[{k:'spin',e:'🌀',c:'#ec4899',n:'Spin'},{k:'jump',e:'⭐',c:'#f5b400',n:'Jump'},{k:'bow',e:'🌸',c:'#a78bfa',n:'Bow'},{k:'leap',e:'⛸️',c:'#0ea5e9',n:'Glide'}];
function simon(root,LEN,firstIntro,onWin,MV,onMiss){ MV=MV||MOVES;
  let round=0, seq=[], input=[], locked=true;
  const dancer=root.querySelector('.dancer'), btns=[...root.querySelectorAll('.pose')], stars=root.querySelector('.stars');
  stars.innerHTML=LEN.map(()=>'<span>☆</span>').join('');
  function doPose(i){ dancer.classList.remove('spin','jump','bow','leap','wiggle'); void dancer.offsetWidth; dancer.classList.add(MV[i].k);
    const b=btns[i]; b.classList.add('lit'); setTimeout(()=>b.classList.remove('lit'),420); sfx.note(i); }
  function playSeq(text){ locked=true; input=[];
    instruct(text,()=>{ seq.forEach((p,k)=>T(()=>doPose(p),400+k*950)); T(()=>{ locked=false; say('Your turn!'); },400+seq.length*950+200); }); }
  function newRound(){ seq=Array.from({length:LEN[round]},()=>rnd(4)); playSeq(round===0?firstIntro:`Now a longer dance, with ${LEN[round]} moves. Watch!`); }
  btns.forEach((b,i)=>b.onclick=()=>{
    if(locked) return;
    doPose(i); input.push(i); const k=input.length-1;
    if(input[k]!==seq[k]){ locked=true; if(onMiss) onMiss(); T(()=>{ sfx.oops(); wiggle(dancer); },400); T(()=>playSeq("Oops! Let's watch one more time."),900); return; }
    if(input.length===seq.length){ locked=true; stars.children[round].textContent='★'; stars.children[round].classList.add('on'); round++; T(()=>sfx.yay(),450);
      if(round>=LEN.length) T(onWin,800); else T(()=>say('Beautiful!',()=>T(newRound,300)),700); }
  });
  currentHint=()=>{ if(locked){ say('Watch the buttons light up!'); return; } playSeq('Watch again, then tap the same buttons in the same order.'); };
  newRound();
}

// matching pairs
function memoryGame(area,faces,names,intro,onWin,back,cls,onMiss){
  const deck=shuffle(faces.flatMap((f,i)=>[i,i]));
  area.innerHTML=`<div class="cards ${cls||''}"></div>`;
  const cards=area.querySelector('.cards'); let open=[], matched=0, busy=false;
  deck.forEach(f=>{
    const c=h(`<button class="card"><div class="cb">${back||'❄️'}</div><div class="cf">${faces[f]()}</div></button>`);
    c.onclick=()=>{
      if(busy||c.classList.contains('up')) return;
      sfx.tap(); c.classList.add('up'); open.push([c,f]);
      if(open.length===2){ const [[a,fa],[b,fb]]=open; open=[];
        if(fa===fb){ matched++; a.classList.add('matched'); b.classList.add('matched'); sfx.sparkle();
          if(matched===faces.length) say(`${names[fa]}! You found all the pairs!`,onWin); else say(`${names[fa]}!`); }
        else { busy=true; if(onMiss) onMiss(); T(()=>{ a.classList.remove('up'); b.classList.remove('up'); busy=false; },1100); } }
    };
    cards.appendChild(c);
  });
  instruct(intro);
  currentHint=()=>say('Try to remember where each friend is hiding. Flip two cards at a time.');
}

// what comes next
const COLORS=[{n:'red',c:'#ef4444'},{n:'orange',c:'#fb923c'},{n:'yellow',c:'#facc15'},{n:'green',c:'#22c55e'},{n:'blue',c:'#3b82f6'},{n:'purple',c:'#a855f7'},{n:'pink',c:'#f472b6'}];
function patternGame(area,units,firstIntro,onDone,shape){ const SH=shape||'crys';
  let pi=0;
  function round(){
    const cols=shuffle(COLORS).slice(0,3), unit=units[pi], shown=[];
    for(let i=0;i<5;i++) shown.push(unit[i%unit.length]);
    const ansK=unit[5%unit.length];
    const opts=[...new Set(unit)].map(k=>cols[k]);
    for(const c of shuffle(COLORS)){ if(opts.length>=3) break; if(!opts.includes(c)) opts.push(c); }
    area.innerHTML=`<div class="patrow">${shown.map(k=>`<div class="${SH}" style="background:${cols[k].c}"></div>`).join('')}<div class="${SH} q">?</div></div><div class="patopts"></div>`;
    const po=area.querySelector('.patopts'), q=area.querySelector('.q');
    shuffle(opts).forEach(c=>{
      const b=h(`<button class="${SH}" style="background:${c.c}" aria-label="${c.n}"></button>`);
      b.onclick=()=>{
        if(c===cols[ansK]){ sfx.yay(); q.className=SH; q.textContent=''; q.style.background=c.c; po.style.pointerEvents='none'; pi++;
          say(`Yes, ${c.n}!`,()=>T(pi<units.length?round:onDone,300)); }
        else { sfx.oops(); wiggle(b); say(`Hmm, that's ${c.n}. Say the pattern out loud and try again!`); }
      };
      po.appendChild(b);
    });
    instruct(pi===0?firstIntro:'Which color comes next?');

// tracing board
function arcPts(cx,cy,rx,ry,a0,a1,n){ const p=[]; for(let i=0;i<=n;i++){ const t=a0+(a1-a0)*i/n; p.push([+(cx+rx*Math.cos(t)).toFixed(1),+(cy+ry*Math.sin(t)).toFixed(1)]); } return p; }
function heartPts(){ const p=[]; for(let i=0;i<=48;i++){ const t=-2*Math.PI*i/48; const x=16*Math.pow(Math.sin(t),3), y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t); p.push([+(50+x*2.4).toFixed(1),+(52-y*2.4).toFixed(1)]); } return p; }
const LETTERS={
  L:[[[30,15],[30,85],[72,85]]],
  U:[[[28,15],[28,60]].concat(arcPts(50,60,22,22,Math.PI,0,14).slice(1)).concat([[72,15]])],
  C:[arcPts(52,50,32,32,-Math.PI/4,-7*Math.PI/4,24)],
  I:[[[50,15],[50,85]],[[34,15],[66,15]],[[34,85],[66,85]]],
  O:[arcPts(50,50,25,34,-Math.PI/2,-5*Math.PI/2,28)],
  V:[[[25,15],[50,85],[75,15]]],
  E:[[[68,15],[32,15],[32,85],[68,85]],[[32,50],[62,50]]],
  F:[[[68,15],[32,15],[32,85]],[[32,50],[60,50]]],
  A:[[[25,85],[50,15],[75,85]],[[36,58],[64,58]]],
  H:[[[30,15],[30,85]],[[70,15],[70,85]],[[30,50],[70,50]]],
  HEART:[heartPts()]
};
function densify(pts,step){ const out=[pts[0]]; for(let i=1;i<pts.length;i++){ const [x0,y0]=pts[i-1],[x1,y1]=pts[i]; const n=Math.max(1,Math.round(Math.hypot(x1-x0,y1-y0)/step)); for(let k=1;k<=n;k++) out.push([x0+(x1-x0)*k/n,y0+(y1-y0)*k/n]); } return out; }
function boardHTML(cls){ return `<div class="board ${cls||''}"><svg class="guide" viewBox="0 0 100 100"></svg><canvas></canvas></div>`; }
function makeTracer(board,pass){
  const guide=board.querySelector('.guide'), cv=board.querySelector('canvas'), ctx=cv.getContext('2d');
  let cps=[], hit=[], inkTotal=0, inkOff=0, last=null, drawing=false, active=false, mode='trace', color='#ec4899', onDone=null;
  function size(){ const r=board.getBoundingClientRect(), d=window.devicePixelRatio||1; cv.width=Math.round(r.width*d); cv.height=Math.round(r.height*d); ctx.setTransform(d,0,0,d,0,0); ctx.lineCap='round'; ctx.lineJoin='round'; }
  function clear(){ ctx.clearRect(0,0,cv.width,cv.height); hit=cps.map(()=>false); inkTotal=0; inkOff=0; last=null; }
  function pos(e){ const r=board.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width*100,y:(e.clientY-r.top)/r.height*100,px:e.clientX-r.left,py:e.clientY-r.top,w:r.width}; }
  function test(x,y){ if(mode!=='trace'){ inkTotal++; return; } let m=1e9; for(let i=0;i<cps.length;i++){ const d=Math.hypot(cps[i][0]-x,cps[i][1]-y); if(d<m) m=d; if(d<10) hit[i]=true; } inkTotal++; if(m>15) inkOff++; }
  function ink(p){
    const lw=mode==='trace'?p.w*0.075:p.w*0.03;
    ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=lw; ctx.shadowColor=mode==='trace'?'#fff':'transparent'; ctx.shadowBlur=mode==='trace'?10:0;
    if(last){ ctx.beginPath(); ctx.moveTo(last.px,last.py); ctx.lineTo(p.px,p.py); ctx.stroke();
      const steps=Math.max(1,Math.ceil(Math.hypot(p.x-last.x,p.y-last.y)/2)); for(let k=1;k<=steps;k++) test(last.x+(p.x-last.x)*k/steps,last.y+(p.y-last.y)*k/steps); }
    else { ctx.beginPath(); ctx.arc(p.px,p.py,lw/2,0,Math.PI*2); ctx.fill(); test(p.x,p.y); }
    last=p;
  }
  function check(){
    const frac=hit.filter(Boolean).length/hit.length;
    if(frac>=(pass||0.92)){ active=false; guide.classList.add('gold'); if(onDone) onDone(); }
    else if(inkTotal>30&&inkOff/inkTotal>0.4){ sfx.oops(); say("Oops, let's stay on the line. Try again!"); clear(); }
  }
  cv.addEventListener('pointerdown',e=>{ if(!active) return; e.preventDefault(); try{ cv.setPointerCapture(e.pointerId); }catch(_){} drawing=true; last=null; ink(pos(e)); });
  cv.addEventListener('pointermove',e=>{ if(!drawing||!active) return; e.preventDefault(); ink(pos(e)); });
  const up=()=>{ if(!drawing) return; drawing=false; last=null; if(mode==='trace') check(); };
  cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
  return {
    load(strokes,cb){ mode='trace'; color='#ec4899'; onDone=cb; active=true; cps=[]; strokes.forEach(s=>densify(s,4).forEach(p=>cps.push(p)));
      const pl=s=>s.map(p=>p.join(',')).join(' ');
      guide.classList.remove('gold');
      guide.innerHTML=strokes.map(s=>`<polyline class="g1" points="${pl(s)}"/>`).join('')+strokes.map(s=>`<polyline class="g2" points="${pl(s)}"/>`).join('')
        +strokes.map((s,i)=>`<circle class="start" cx="${s[0][0]}" cy="${s[0][1]}" r="5"/><text class="n" x="${s[0][0]}" y="${s[0][1]}">${i+1}</text>`).join('');
      size(); clear(); },
    free(guideMarkup){ mode='free'; active=true; cps=[]; guide.classList.remove('gold'); guide.innerHTML=guideMarkup||''; size(); clear(); },
    setColor(c){ color=c; },
    get ink(){ return inkTotal; },
    hint(){ guide.classList.remove('hint'); void guide.offsetWidth; guide.classList.add('hint'); },
    resize(){ size(); clear(); }
  };
}
function traceSeq(area,keys,slotLabels,boardCls,intros,onEach,onAll,pass){
  area.innerHTML=`<div class="name">${slotLabels.map(c=>`<span>${c}</span>`).join('')}</div>${boardHTML(boardCls)}`;
  const slots=area.querySelector('.name'), tr=makeTracer(area.querySelector('.board'),pass); let i=0;
  window.onresize=()=>tr.resize();
  function next(){
    [...slots.children].forEach((s,k)=>s.classList.toggle('cur',k===i));
    instruct(intros(keys[i],i));
    tr.load(LETTERS[keys[i]],()=>{
      sfx.yay(); slots.children[i].classList.add('got'); slots.children[i].classList.remove('cur'); const key=keys[i]; i++;
      if(i<keys.length) say(onEach(key),()=>T(next,300));
      else { slots.classList.add('done'); onAll(key); }
    });
  }
  currentHint=()=>{ tr.hint(); say('Put your finger on the green dot with number one, and follow the line, nice and slow.'); };
  next();
}

function snowRounds(){

  let a=randInt(2,M-2), b=randInt(1,Math.min(4,M-a)); r.push({t:'add',a,b});
  const x=randInt(1,M-1); let y; do{ y=randInt(1,M); }while(y===x); r.push({t:'more',x,y});
  const n=randInt(4,M), p=randInt(1,Math.min(3,n-1)); r.push({t:'sub',n,p});
  a=randInt(2,M-2); b=randInt(1,Math.min(4,M-a)); r.push({t:'add',a,b,spider:true});

}

function jPool(){
  const el=shell('pool','The Pool'); const st=el.querySelector('.stage');
  st.innerHTML=`<div class="swimmer">${luciaSVG()}<div class="ring"></div></div><div class="prog"></div><div class="tank"></div><div class="answers"></div>`;
  show(el);
  const M=5, rounds=[];
  rounds.push({type:'count',n:randInt(2,5)}); rounds.push({type:'count',n:randInt(3,5)});
  let a=randInt(1,3), b=randInt(1,Math.min(3,M-a)); rounds.push({type:'add',a,b});
  const n0=randInt(3,5), p0=randInt(1,Math.min(2,n0-1)); rounds.push({type:'sub',n:n0,p:p0});
  a=randInt(1,3); b=randInt(1,Math.min(3,M-a)); rounds.push({type:'add',a,b});
  let r=0;
  const prog=st.querySelector('.prog'), tank=st.querySelector('.tank'), ans=st.querySelector('.answers');
  prog.innerHTML=rounds.map(()=>'<span class="pdot"></span>').join('');
  function run(){
    const R=rounds[r]; let counted=0, hints=0, answer;
    tank.innerHTML=''; ans.innerHTML=''; ans.style.pointerEvents='';
    const mk=(cls,content)=>{ const d=h(`<div class="obj ${cls}">${content}</div>`);
      d.onclick=()=>{ if(d.classList.contains('counted')||d.classList.contains('popped')) return; counted++; d.classList.add('counted'); d.dataset.n=counted; sfx.tap(); say(String(counted)); };
      return d; };
    if(R.type==='count'){
      answer=R.n; const g=h('<div class="group"></div>');
      for(let i=0;i<R.n;i++){ const f=mk('fish',i%2?'🐠':'🐟'); f.style.animationDelay=(-Math.random()*2)+'s'; g.appendChild(f); }
      tank.appendChild(g);
      instruct(r===0?'Lucia is swimming with the fish! How many fish are there? Tap each fish to count.':'How many fish are swimming now?');
    } else if(R.type==='add'){
      answer=R.a+R.b;
      const g1=h('<div class="group"></div>'), g2=h('<div class="group" style="position:relative"></div>');
      for(let i=0;i<R.a;i++) g1.appendChild(mk('bub',''));
      for(let i=0;i<R.b;i++) g2.appendChild(mk('bub pink',''));
      g2.appendChild(h(`<div class="minispider">${spiderSVG()}</div>`));
      tank.append(g1,h('<div class="plus">+</div>'),g2);
      instruct(`Lucia blows ${R.a} bubble${R.a>1?'s':''}. A spider brings ${R.b} more! How many bubbles altogether?`);
    } else {
      answer=R.n-R.p; const g=h('<div class="group"></div>'), bs=[];
      for(let i=0;i<R.n;i++){ const b2=mk('bub',''); bs.push(b2); g.appendChild(b2); }
      tank.append(g,h(`<div class="peek">${kidSVG('elias')}</div>`));
      instruct(`There are ${R.n} bubbles. Uh oh, Elias pops ${R.p}! How many are left?`);
      T(()=>{ for(let k=0;k<R.p;k++) bs[R.n-1-k].classList.add('popped'); sfx.pop(); },2600);
    }
    numChoices(answer,M).forEach(v=>{
      const btn=h(`<button class="num" data-v="${v}"><b>${v}</b><div class="dots">${'<i></i>'.repeat(v)}</div></button>`);
      btn.onclick=()=>{
        if(v===answer){ sfx.yay(); btn.classList.add('right'); ans.style.pointerEvents='none'; prog.children[r].classList.add('on'); r++;
          say(`Yes! ${v}!`); T(()=>r>=rounds.length?complete(1):run(),1900); }
        else { sfx.oops(); wiggle(btn); say('Not quite. Tap each one to count!'); }
      };
      ans.appendChild(btn);
    });
    currentHint=()=>{ hints++;
      if(hints>=2){ const c=[...ans.children].find(x=>+x.dataset.v===answer); if(c) c.classList.add('glow'); say('Emmy thinks it is this one!'); }
      else say('Emmy says: touch each one and count out loud. One, two, three!'); };
  }
  run();
}

// Repeating strips (sky edge, far layer, near ground) are SVG data URIs tiled across the width;
// corner props are inline SVG anchored to the edges so the middle stays calm for the games.
const SV=(w,h,body)=>`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${body}</svg>`;
const dURL=s=>`url('data:image/svg+xml,${encodeURIComponent(s)}')`;
const strip=(pos,svg,h,extra,cls)=>`<div class="sk sk-${pos} ${cls||''}" style="background-image:${dURL(svg)};height:${h};${extra||''}"></div>`;
const prop=(side,w,svg,extra)=>`<div class="prop p${side}" style="width:${w};${extra||''}">${svg}</div>`;
const ETXT=(e,x,y,s,cls)=>`<text x="${x}" y="${y}" font-size="${s}" text-anchor="middle" class="${cls||''}">${e}</text>`;
function blades(w,h,top,n,amp,col,seed){ let d=`M0 ${h}V${top}`; const st=w/n; for(let i=0;i<n;i++){ const x=i*st, a=amp*(0.55+0.45*Math.abs(Math.sin((i+1)*(seed||1.7)))); d+=` L${(x+st*0.5).toFixed(1)} ${(top-a).toFixed(1)} L${(x+st).toFixed(1)} ${top}`; } return `<path fill="${col}" d="${d}V${h}Z"/>`; }
function bumps(w,h,top,n,amp,col){ let d=`M0 ${h}V${top}`; const st=w/n; for(let i=0;i<n;i++){ const x=i*st; d+=` Q${(x+st/2).toFixed(1)} ${top-amp} ${(x+st).toFixed(1)} ${top}`; } return `<path fill="${col}" d="${d}V${h}Z"/>`; }
const leafE=(x,y,a,c,s)=>`<ellipse cx="${x}" cy="${y}" rx="${10*(s||1)}" ry="${4.5*(s||1)}" fill="${c}" transform="rotate(${a} ${x} ${y})"/>`;
function flowerHead(cx,cy,n,rx,ry,pc,cc,cr){ let s=''; for(let i=0;i<n;i++) s+=`<ellipse cx="${cx}" cy="${cy-ry}" rx="${rx}" ry="${ry}" fill="${pc}" transform="rotate(${(360/n*i).toFixed(1)} ${cx} ${cy})"/>`; return s+`<circle cx="${cx}" cy="${cy}" r="${cr}" fill="${cc}"/>`; }

function lvl(k){ return (S.lvl&&S.lvl[k])||1; }
function adapt(k,miss){ if(!S.lvl) S.lvl={}; let L=lvl(k); if(miss<=1&&L<3) L++; else if(miss>=4&&L>1) L--; S.lvl[k]=L; save(); }

/* ---------- 1. Balance Scale (jungle) ---------- */
function gBalance(area,done){

          : [{left:[['🐘',13]],pre:0,crate:true},{left:[['🐯',8],['🐯',9]],pre:2,crate:true},{left:[['🐘',15],['🐯',4]],pre:4,crate:true}];
  function round(){
    const Rr=R[r], target=Rr.left.reduce((a,x)=>a+x[1],0); let right=[]; for(let i=0;i<Rr.pre;i++) right.push(1);
    area.innerHTML=`<div class="prog">${R.map((x,i)=>`<span class="pdot ${i<r?'on':''}"></span>`).join('')}</div>
<div class="scale"><div class="beam"><div class="pan pl"><div class="load">${Rr.left.map(x=>`<span class="pc">${x[0]}<i>${x[1]}</i></span>`).join('')}</div><div class="tray"></div></div><div class="bar"></div><div class="pan pr"><div class="load rload"></div><div class="tray"></div></div></div><div class="post"></div></div>
<div class="weights"><span class="wl">${target}</span><span class="wsign">?</span><span class="wr">0</span></div>
<div class="palette2"><button class="addp" data-w="1">🐒<i>1</i></button>${Rr.crate?'<button class="addp" data-w="5">🍌<i>5</i></button>':''}</div>`;
    const beam=area.querySelector('.beam'), rload=area.querySelector('.rload'), wr=area.querySelector('.wr'), sign=area.querySelector('.wsign'), pans=area.querySelectorAll('.pan'); let solved=false, over=false;
    function draw(){
      const tot=right.reduce((a,b)=>a+b,0);
      rload.innerHTML=right.map((w,i)=>`<span class="pc rm" data-i="${i}">${w===5?'🍌':'🐒'}<i>${w}</i></span>`).join('');
      wr.textContent=tot; sign.textContent=tot===target?'=':tot<target?'>':'<';
      const ang=Math.max(-16,Math.min(16,(tot-target)*2.5)); beam.style.transform=`rotate(${ang}deg)`; pans.forEach(p=>p.style.transform=`rotate(${-ang}deg)`);
      rload.querySelectorAll('.rm').forEach(b=>b.onclick=()=>{ if(solved) return; sfx.tap(); right.splice(+b.dataset.i,1); draw(); });
      if(tot===target&&!solved){ solved=true; sfx.yay(); r++; say(`Balanced! ${target} and ${target}.${praise()}`,()=>T(r<R.length?round:finish,400)); }
      else if(tot>target&&!over){ over=true; miss++; sfx.oops(); say('Too heavy! Tap a monkey on the scale to take it off.'); }
      else if(tot<=target) over=false;
    }
    area.querySelectorAll('.addp').forEach(b=>b.onclick=()=>{ if(solved) return; sfx.tap(); right.push(+b.dataset.w); draw(); });
    draw();
    instruct((r===0?"Alice says: I've got a game! ":'')+(Rr.left.length>1?`These animals weigh ${Rr.left.map(x=>x[1]).join(' and ')}.`:`The ${Rr.left[0][0]==='🐘'?'elephant':'tiger'} weighs ${target}.`)+(Rr.pre?` There are already ${Rr.pre} monkeys on the other side.`:'')+` Add ${Rr.crate?'monkeys and banana crates':'monkeys'} until the scale balances! Each monkey weighs 1${Rr.crate?', and a crate weighs 5':''}.`);
    currentHint=()=>{ const tot=right.reduce((a,b)=>a+b,0); say(`The left side is ${target}. Your side is ${tot}. You need ${Math.max(0,target-tot)} more.`+fran('tigre','means tiger!')); };
  }

}

/* ---------- 3. Picture Sudoku (flower meadow) ---------- */
function sudSolve(g,n,count){
  const i=g.indexOf(-1); if(i<0) return count+1;
  const r=Math.floor(i/n), c=i%n;
  for(let v=0;v<n;v++){
    let ok=true; for(let k=0;k<n;k++){ if(g[r*n+k]===v||g[k*n+c]===v){ ok=false; break; } }
    if(ok){ g[i]=v; count=sudSolve(g,n,count); g[i]=-1; if(count>1) return count; }
  }
  return count;
}
function makeSudoku(n,holes){
  const rows=shuffle([...Array(n).keys()]), cols=shuffle([...Array(n).keys()]), sym=shuffle([...Array(n).keys()]);
  const sol=[]; for(let r=0;r<n;r++) for(let c=0;c<n;c++) sol.push(sym[(rows[r]+cols[c])%n]);
  const puz=sol.slice(); let removed=0;
  for(const i of shuffle([...Array(n*n).keys()])){ if(removed>=holes) break; const keep=puz[i]; puz[i]=-1; if(sudSolve(puz.slice(),n,0)===1) removed++; else puz[i]=keep; }
  return {sol,puz};
}
function gSudoku(area,done){
  const L=lvl('sudoku'); let miss=0, pi=0;
  const plan = L===1?[[3,3],[3,4]]:L===2?[[3,5],[4,6]]:[[4,8],[4,10]];
  const SYM=['🌸','🦋','🐛','🌼'], NAME={'🌸':'flower','🦋':'butterfly','🐛':'caterpillar','🌼':'daisy'};
  function round(){
    const [n,holes]=plan[pi], {sol,puz}=makeSudoku(n,holes), grid=puz.slice(); let sel=grid.indexOf(-1), hints=0;
    area.innerHTML=`<div class="prog">${plan.map((x,i)=>`<span class="pdot ${i<pi?'on':''}"></span>`).join('')}</div><div class="sgrid n${n}">${grid.map((v,i)=>`<button class="scell ${v<0?'empty':'given'}" data-i="${i}">${v<0?'':SYM[v]}</button>`).join('')}</div><div class="spal">${SYM.slice(0,n).map((s,v)=>`<button class="spick" data-v="${v}">${s}</button>`).join('')}</div>`;
    const cells=[...area.querySelectorAll('.scell')];
    const mark=()=>cells.forEach((c,i)=>c.classList.toggle('sel',i===sel));
    cells.forEach(c=>c.onclick=()=>{ const i=+c.dataset.i; if(grid[i]>=0) return; sfx.tap(); sel=i; mark(); });
    area.querySelectorAll('.spick').forEach(b=>b.onclick=()=>{
      if(sel<0) return; const v=+b.dataset.v, r=Math.floor(sel/n), c=sel%n;
      let clash=null; for(let k=0;k<n;k++){ if(grid[r*n+k]===v) clash='row'; else if(grid[k*n+c]===v) clash='column'; }
      if(clash){ miss++; sfx.oops(); wiggle(cells[sel]); say(`There's already a ${NAME[SYM[v]]} in that ${clash}!`); return; }
      if(sol[sel]!==v){ miss++; sfx.oops(); wiggle(cells[sel]); say("Hmm, that doesn't fit yet. Look at the row and the column."); return; }
      grid[sel]=v; cells[sel].textContent=SYM[v]; cells[sel].classList.remove('empty'); cells[sel].classList.add('filled'); sfx.chime();
      sel=grid.indexOf(-1); mark();
      if(sel<0){ sfx.yay(); pi++; say(`You solved it! Every row and column has one of each.${praise()}`,()=>T(pi<plan.length?round:()=>{ adapt('sudoku',miss); done(); },400)); }
    });
    mark();
    instruct(pi===0?"Alice says: Garden puzzle! Every row and every column needs one of each. Tap an empty spot, then pick what goes there.":`Now a ${n===4?'bigger ':''}puzzle. Every row and column needs one of each!`);
    currentHint=()=>{ hints++; if(sel<0) return; const r=Math.floor(sel/n), c=sel%n, have=new Set(); for(let k=0;k<n;k++){ if(grid[r*n+k]>=0) have.add(grid[r*n+k]); if(grid[k*n+c]>=0) have.add(grid[k*n+c]); }
      if(hints>=2){ say(`It's the ${NAME[SYM[sol[sel]]]}!`); return; }
      say(`Look at this spot's row and column. They already have ${[...have].map(v=>'a '+NAME[SYM[v]]).join(' and ')||'nothing yet'}. What's missing?`+fran('mariposa','means butterfly!')); };
  }
  round();
}

/* ---------- 4. Caterpillar Numbers (flower meadow) ---------- */
function gCater(area,done){
  const L=lvl('cater'); let miss=0, r=0;
  const plan = L===1?[[1,1],[10,1],[1,2],[2,1]]:L===2?[[1,2],[2,2],[5,2],[10,2]]:[[2,2],[5,3],[10,2],[1,3]];
  const word={1:'ones',2:'twos',5:'fives',10:'tens'};
  function round(){
    const [step,nMiss]=plan[r];
    let start = step===1?randInt(L===3?36:10,L===3?66:85):step===2?2*randInt(1,40):step===5?5*randInt(1,12):10*randInt(1,4);
    if(L===3&&step===1) start=10*randInt(3,7)+randInt(6,8);
    const seq=[...Array(6).keys()].map(i=>start+i*step).filter(v=>v<=100);
    while(seq.length<6) seq.unshift(seq[0]-step);
    const holes=shuffle([1,2,3,4,5]).slice(0,nMiss).sort((a,b)=>a-b); let h=0;
    area.innerHTML=`<div class="prog">${plan.map((x,i)=>`<span class="pdot ${i<r?'on':''}"></span>`).join('')}</div><div class="cater"><div class="chead">🐛</div>${seq.map((v,i)=>`<div class="cseg ${holes.includes(i)?'hole':''}" data-i="${i}">${holes.includes(i)?'?':v}</div>`).join('')}</div><div class="answers"></div>`;
    const segs=[...area.querySelectorAll('.cseg')], ans=area.querySelector('.answers');
    function ask(){
      const i=holes[h], v=seq[i]; segs.forEach((s,k)=>s.classList.toggle('cur',k===i));
      const opts=shuffle([v, v+step===seq[i+1]?v-1:v+step, v+1===seq[i-1]?v-step:v+1].filter((x,j,a)=>x>=0&&a.indexOf(x)===j)); while(opts.length<3) opts.push(v+opts.length*3+1);
      ans.innerHTML=choiceBtns(shuffle(opts));
      ans.querySelectorAll('.num').forEach(b=>b.onclick=()=>{
        if(+b.dataset.v===v){ sfx.chime(); segs[i].textContent=v; segs[i].classList.remove('hole','cur'); segs[i].classList.add('filled'); h++;
          if(h<holes.length) ask(); else { sfx.yay(); r++; say(`${seq.join(', ')}! You counted by ${word[step]}!${praise()}`,()=>T(r<plan.length?round:()=>{ adapt('cater',miss); done(); },400)); } }
        else { miss++; sfx.oops(); wiggle(b); say(`Hmm. We're counting by ${word[step]}. Try again!`); }
      });
    }
    instruct((r===0?"Alice says: This caterpillar lost some of its numbers! ":'')+`Count by ${word[step]}. ${seq.slice(0,holes[0]).join(', ')}... what comes next?`);
    currentHint=()=>{ const i=holes[h]; say(`Count by ${word[step]}: ${seq.slice(0,i).join(', ')}... then ${seq[i]}!`); };
    ask();
  }
  round();
}

/* ---------- 11. Spaceship Code Lock (finale) ---------- */
const SHAPES=[['⭐','star'],['🔵','circle'],['🔺','triangle'],['🟩','square']];
function perms(a){ if(a.length<2) return [a]; return a.flatMap((x,i)=>perms(a.slice(0,i).concat(a.slice(i+1))).map(p=>[x,...p])); }
function gCode(area,done){
  const L=lvl('code'); let miss=0, r=0;
  const plan = L===1?[3,3]:L===2?[3,4]:[4,4];
  const ORD=['first','second','third','fourth'];
  function round(){
    const k=plan[r], shapes=SHAPES.slice(0,k), sol=shuffle([...Array(k).keys()]), all=perms([...Array(k).keys()]);
    const pool=[]; sol.forEach((s,pos)=>{ pool.push({t:'is',s,pos}); for(let p=0;p<k;p++) if(p!==pos) pool.push({t:'not',s,pos:p}); if(pos<k-1) pool.push({t:'before',s,s2:sol[pos+1]}); });
    const test=(c,p)=>c.t==='is'?p[c.pos]===c.s:c.t==='not'?p[c.pos]!==c.s:p.indexOf(c.s)+1===p.indexOf(c.s2);
    let clues=[], left=all; const order=shuffle(pool).sort((a,b)=>(a.t==='is')-(b.t==='is'));
    for(const c of order){ if(left.length===1) break; const nl=left.filter(p=>test(c,p)); if(nl.length<left.length&&nl.length>0){ clues.push(c); left=nl; } }
    const nm=i=>shapes[i][1], em=i=>shapes[i][0];
    const ctext=c=>c.t==='is'?`The ${nm(c.s)} is ${c.pos===k-1?'last':ORD[c.pos]}.`:c.t==='not'?`The ${nm(c.s)} is not ${c.pos===k-1?'last':ORD[c.pos]}.`:`The ${nm(c.s)} comes right before the ${nm(c.s2)}.`;
    const cicon=c=>c.t==='before'?`${em(c.s)}➡️${em(c.s2)}`:`${em(c.s)} ${c.t==='not'?'<span class="x">✘</span>':'<span class="ok">✔</span>'} <b>${c.pos+1}</b>`;
    let slots=[];
    area.innerHTML=`<div class="prog">${plan.map((x,i)=>`<span class="pdot ${i<r?'on':''}"></span>`).join('')}</div><div class="clues">${clues.map((c,i)=>`<div class="clue cl" data-i="${i}">${cicon(c)}</div>`).join('')}</div><div class="lock">${[...Array(k)].map((_,i)=>`<button class="slot2" data-i="${i}"><small>${i+1}</small></button>`).join('')}</div><div class="spal">${shapes.map((s,i)=>`<button class="spick" data-v="${i}">${s[0]}</button>`).join('')}</div>`;
    const sl=[...area.querySelectorAll('.slot2')], cl=[...area.querySelectorAll('.cl')];
    const draw=()=>sl.forEach((b,i)=>b.innerHTML=slots[i]!==undefined?em(slots[i]):`<small>${i+1}</small>`);
    sl.forEach((b,i)=>b.onclick=()=>{ if(slots[i]===undefined) return; sfx.tap(); slots[i]=undefined; draw(); });
    area.querySelectorAll('.spick').forEach(b=>b.onclick=()=>{
      const v=+b.dataset.v; if(slots.includes(v)) { say(`The ${nm(v)} is already in the lock.`); return; }
      const i=[...Array(k).keys()].find(j=>slots[j]===undefined); if(i===undefined) return; sfx.tap(); slots[i]=v; draw();
      if(slots.filter(x=>x!==undefined).length===k){
        const bad=clues.findIndex(c=>!test(c,slots));
        if(bad<0){ sfx.yay(); r++; say(`Click! The lock opens!${praise()}`,()=>T(r<plan.length?round:()=>{ adapt('code',miss); done(); },400)); }
        else { miss++; sfx.oops(); cl.forEach(x=>x.classList.remove('glow')); cl[bad].classList.add('glow'); say(`Not quite. Check this clue: ${ctext(clues[bad])} Tap a shape in the lock to take it out.`); }
      }
    });
    instruct((r===0?"The aliens' spaceship has a code lock! ":'')+'Use the clues to put the shapes in order. '+clues.map(ctext).join(' '));
    currentHint=()=>say('The clues are: '+clues.map(ctext).join(' ')+fran('estrella','means star!'));
  }
  round();
}

const dots=(arr,r)=>`<div class="prog">${arr.map((x,i)=>`<span class="pdot ${i<r?'on':''}"></span>`).join('')}</div>`;
const WING=e=>e==='mball'?'<span class="mball"></span>':e;

/* ---------- 1. Puddle Path: plan Horsie's steps around the puddles (city) ---------- */
const WDIR={up:[0,-1,'⬆️'],down:[0,1,'⬇️'],left:[-1,0,'⬅️'],right:[1,0,'➡️']};
function wBFS(C,R,pud,from,goal){
  const key=p=>p[0]+','+p[1], prev={}, q=[from]; prev[key(from)]=null;
  while(q.length){ const c=q.shift(); if(c[0]===goal[0]&&c[1]===goal[1]) break;
    for(const d of ['right','up','down','left']){ const n=[c[0]+WDIR[d][0],c[1]+WDIR[d][1]];
      if(n[0]<0||n[1]<0||n[0]>=C||n[1]>=R||pud.has(key(n))||key(n) in prev) continue; prev[key(n)]=[c,d]; q.push(n); } }
  if(!(key(goal) in prev)) return null;
  const out=[]; let k=key(goal); while(prev[k]){ out.unshift(prev[k][1]); k=key(prev[k][0]); } return out;
}
function puddleMap(L){
  const C=L===1?4:5, R=L===1?3:L===2?4:5, want=L===1?[3,4]:L===2?[5,6]:[7,9];
  for(let t=0;t<400;t++){
    const sy=rnd(R), gy=rnd(R); let x=0,y=sy; const path=[[0,sy]], seen=new Set(['0,'+sy]); let ok=true;
    while(x<C-1||y!==gy){
      const opts=[]; if(x<C-1) opts.push([1,0],[1,0]); if(y<gy) opts.push([0,1]); if(y>gy) opts.push([0,-1]);
      if(L===3&&x>0&&x<C-1){ if(y>0) opts.push([0,-1]); if(y<R-1) opts.push([0,1]); }
      const m=opts[rnd(opts.length)]; x+=m[0]; y+=m[1]; if(seen.has(x+','+y)){ ok=false; break; } seen.add(x+','+y); path.push([x,y]); if(path.length>20){ ok=false; break; } }
    if(!ok) continue;
    const free=[]; for(let yy=0;yy<R;yy++) for(let xx=0;xx<C;xx++) if(!seen.has(xx+','+yy)) free.push([xx,yy]);
    const pud=new Set(shuffle(free).slice(0,Math.round(free.length*(L===1?0.5:0.6))).map(p=>p[0]+','+p[1]));
    const best=wBFS(C,R,pud,[0,sy],[C-1,gy]);
    if(!best||best.length<want[0]||best.length>want[1]) continue;
    return {C,R,start:[0,sy],goal:[C-1,gy],pud,best};
  }
  return {C:4,R:3,start:[0,1],goal:[3,1],pud:new Set(['1,1','2,2']),best:['up','right','right','down','right']};
}
function gPuddle(area,done){
  const L=lvl('puddle'); let miss=0, r=0; const N=3;
  function round(){
    const M=puddleMap(L); let prog=[], busy=false, pos=M.start.slice();
    area.innerHTML=`${dots([...Array(N)],r)}<div class="w-pgrid" style="grid-template-columns:repeat(${M.C},1fr);--r:${Math.max(M.R,M.C)}">${[...Array(M.R)].map((_,y)=>[...Array(M.C)].map((_,x)=>`<div class="w-cell ${M.pud.has(x+','+y)?'pud':''}" data-k="${x},${y}">${M.pud.has(x+','+y)?'<span class="w-puddle"></span>':''}${x===M.goal[0]&&y===M.goal[1]?'<span class="w-goal">🌲</span>':''}</div>`).join('')).join('')}</div>
<div class="w-prgm"></div><div class="w-arrows">${['left','up','down','right'].map(d=>`<button class="w-arr" data-d="${d}">${WDIR[d][2]}</button>`).join('')}<button class="w-arr w-undo" aria-label="Undo">↩️</button><button class="w-go">Go!</button></div>`;
    const grid=area.querySelector('.w-pgrid'), pr=area.querySelector('.w-prgm');
    const hz=h(`<div class="w-hz">${horsieSVG()}</div>`);
    const place=()=>grid.querySelector(`[data-k="${pos[0]},${pos[1]}"]`).appendChild(hz);
    const drawProg=()=>{ pr.innerHTML=prog.length?prog.map((d,i)=>`<span class="w-chip" data-i="${i}">${WDIR[d][2]}</span>`).join(''):'<span class="w-empty">Tap the arrows to plan Horsie\'s steps</span>'; };
    place(); drawProg();
    area.querySelectorAll('.w-arr[data-d]').forEach(b=>b.onclick=()=>{ if(busy) return; if(prog.length>=14){ say('That is a lot of steps! Tap Go to try them.'); return; } sfx.tap(); prog.push(b.dataset.d); drawProg(); });
    area.querySelector('.w-undo').onclick=()=>{ if(busy||!prog.length) return; sfx.tap(); prog.pop(); drawProg(); };
    area.querySelector('.w-go').onclick=()=>{
      if(busy) return; if(!prog.length){ say('First tap the arrows to plan the steps. Then tap Go!'); return; }
      busy=true; pos=M.start.slice(); place(); let k=0;
      const chips=[...pr.querySelectorAll('.w-chip')];
      const step=()=>{
        if(k>=prog.length){
          if(pos[0]===M.goal[0]&&pos[1]===M.goal[1]){ sfx.yay(); r++; say(`Clip, clop! Horsie made it with dry hooves!`,()=>T(r<N?round:()=>{ adapt('puddle',miss); done(); },400)); }
          else { miss++; sfx.oops(); say('Horsie needs more steps to get to the trees! Add some more arrows.',()=>{ pos=M.start.slice(); place(); busy=false; }); }
          return; }
        const d=prog[k], n=[pos[0]+WDIR[d][0],pos[1]+WDIR[d][1]]; chips.forEach((c,i)=>c.classList.toggle('cur',i===k));
        if(n[0]<0||n[1]<0||n[0]>=M.C||n[1]>=M.R){ miss++; sfx.oops(); wiggle(hz); chips[k].classList.add('bad');
          say("Bonk! That's the edge of the street. Let's fix that step.",()=>{ prog=prog.slice(0,k); drawProg(); pos=M.start.slice(); place(); busy=false; }); return; }
        pos=n; place(); sfx.note(k);
        if(M.pud.has(n[0]+','+n[1])){ miss++; hz.classList.add('splash'); chips[k].classList.add('bad');
          T(()=>{ sfx.oops(); say("Splash! Eww, a puddle! Horsie is a fancy hotel horse. He does NOT like puddles! Let's fix that step.",()=>{ hz.classList.remove('splash'); prog=prog.slice(0,k); drawProg(); pos=M.start.slice(); place(); busy=false; }); },250); return; }
        k++; T(step,520);
      };
      T(step,300);
    };
    instruct((r===0?"Horsie is a fancy hotel horse, and he does NOT like puddles! ":'')+'Tap the arrows to plan his steps to the trees. Then tap Go!');
    currentHint=()=>{ let p=M.start.slice(), ok=true;
      for(const d of prog){ p=[p[0]+WDIR[d][0],p[1]+WDIR[d][1]]; if(p[0]<0||p[1]<0||p[0]>=M.C||p[1]>=M.R||M.pud.has(p[0]+','+p[1])){ ok=false; break; } }
      if(!ok){ say('One of your steps goes in a puddle. Tap the back arrow to take steps away.'); return; }
      const rest=wBFS(M.C,M.R,M.pud,p,M.goal); if(!rest||!rest.length){ say('You planned the whole way! Tap Go!'); return; }
      say('Try this next: '+rest.slice(0,2).join(', then ')+'.'); };
  }
  round();
}

function gBigger(area,done){

  const pair=()=>{ if(L===1){ const a=randInt(1,10); let b; do{ b=randInt(1,10); }while(b===a); return [a,b]; }
    if(L===2){ const a=randInt(3,20); let b; do{ b=randInt(1,20); }while(b===a||Math.abs(a-b)>8); return [a,b]; }
    const t=rnd(3); if(t===0){ let a,b; do{ a=randInt(1,9); b=randInt(1,9); }while(a===b); return [a*10+b,b*10+a]; }

    let a,b; do{ a=randInt(12,99); b=randInt(12,99); }while(Math.floor(a/10)===Math.floor(b/10)); return [a,b]; };
  function round(){

    const hz=area.querySelector('.w-hzmid'); let doneR=false;

/* ---------- 8. Chickie's Keyhole Maze (tower door) ---------- */
function makeMaze(n){
  const W=[...Array(n*n)].map(()=>({n:1,e:1,s:1,w:1})), seen=new Set([0]), st=[0];
  while(st.length){ const c=st[st.length-1], x=c%n, y=Math.floor(c/n), nb=[];
    if(y>0&&!seen.has(c-n)) nb.push([c-n,'n','s']); if(x<n-1&&!seen.has(c+1)) nb.push([c+1,'e','w']);
    if(y<n-1&&!seen.has(c+n)) nb.push([c+n,'s','n']); if(x>0&&!seen.has(c-1)) nb.push([c-1,'w','e']);
    if(!nb.length){ st.pop(); continue; } const [m,a,b]=nb[rnd(nb.length)]; W[c][a]=0; W[m][b]=0; seen.add(m); st.push(m); }
  return W;
}
function mazePath(W,n,from,to){ const prev={[from]:null}, q=[from], D={n:-n,e:1,s:n,w:-1};
  while(q.length){ const c=q.shift(); if(c===to) break; for(const d of 'nesw'){ if(W[c][d]) continue; const m=c+D[d]; if(m in prev) continue; prev[m]=c; q.push(m); } }
  const out=[]; let k=to; while(prev[k]!==null&&k!==undefined){ out.unshift(k); k=prev[k]; } return out; }
function gMaze(area,done){
  const L=lvl('maze'), n=L===1?4:L===2?5:6; let miss=0, r=0; const N=2;
  function round(){
    const W=makeMaze(n), goal=n*n-1; let pos=0;
    area.innerHTML=`${dots([...Array(N)],r)}<div class="w-maze" style="grid-template-columns:repeat(${n},1fr);--n:${n}">${W.map((c,i)=>`<button class="w-mc ${c.n?'bn':''} ${c.e?'be':''} ${c.s?'bs':''} ${c.w?'bw':''}" data-i="${i}">${i===goal?'<span class="w-key">🗝️</span>':''}</button>`).join('')}</div>
<div class="w-arrows">${['left','up','down','right'].map(d=>`<button class="w-arr" data-d="${d}">${WDIR[d][2]}</button>`).join('')}</div>`;
    const cells=[...area.querySelectorAll('.w-mc')], ck=h(`<div class="w-chick">${chickieSVG()}</div>`); let fin=false;
    const put=()=>{ cells[pos].appendChild(ck); cells[pos].classList.add('trail'); };
    put();
    const D={up:['n',-n],down:['s',n],left:['w',-1],right:['e',1]};
    function move(d){ if(fin) return; const [wd,off]=D[d];
      if(W[pos][wd]){ miss++; sfx.oops(); wiggle(ck); return; }
      pos+=off; put(); sfx.tap();
      if(pos===goal){ fin=true; sfx.yay(); r++; say(r<N?'Chickie got through! Oh, there is a second lock inside. Help Chickie one more time!':'Peep peep! Chickie found the key and unlocked the door! Click!',()=>T(r<N?round:()=>{ adapt('maze',Math.floor(miss/3)); done(); },400)); } }
    area.querySelectorAll('.w-arr').forEach(b=>b.onclick=()=>move(b.dataset.d));
    cells.forEach((c,i)=>c.onclick=()=>{ for(const d in D){ if(pos+D[d][1]===i&&(d==='up'||d==='down'||Math.floor(i/n)===Math.floor(pos/n))){ move(d); return; } } });
    if(r===0) instruct("The door at the top is locked! Chickie says: Peep! I'm small enough to squeeze through the keyhole! Help Chickie find her way through the lock to the key.");
    else instr='Help Chickie get to the key!';
    currentHint=()=>{ const p=mazePath(W,n,pos,goal); if(!p.length) return; const nx=p[0]; cells[nx].classList.add('hint'); T(()=>cells[nx].classList.remove('hint'),1600);
      say('Go '+(nx===pos-n?'up':nx===pos+n?'down':nx===pos-1?'left':'right')+'!'); };
  }
  round();
}

}

const W_GAMES={puddle:gPuddle,bigger:gBigger,breathe:gBreathe,herd:gHerd,lily:gLily,bubbles:gBubbles,stairs:gStairs,maze:gMaze,pantry:gPantry,cook:gCook};
const W_TITLES={puddle:'Puddle Path',bigger:'Bigger Number Street',breathe:'Calm Breathing',herd:'Glow-Bug Herding',lily:'Lily Pad Dance',bubbles:'Bubble Words',stairs:'Tower Stairs',maze:"Chickie's Maze",pantry:'Pantry Matching',cook:'Cook It Right'};
const W_EMO={puddle:'🐴',bigger:'🏮',breathe:'🧘',herd:'🐞',lily:'🩰',bubbles:'🫧',stairs:'🪜',maze:'🐤',pantry:'🫙',cook:'🍝'};
const W_WORLDS=[
  {name:'City at Night',icon:'🌃',cls:'w-city',games:['puddle','bigger'],
   intro:"Horsie grows big, big, BIG! Everyone climbs on, and Horsie clip-clops into the city at night. Taz sniffs the air. He smells Grumpa's meatballs! This way!"},
  {name:'Wobbly Woods',icon:'🌲',cls:'w-woods',games:['breathe','herd'],
   intro:"The Wobbly Woods! Denadu's spell makes the paths twist and the trees shuffle around. Which way do we go? Everybody is getting wobbly. Spence the yoga bear sits down and closes his eyes."},
  {name:'Bubble Bog',icon:'🪷',cls:'w-bog',games:['lily','bubbles'],
   intro:"Blub, blub! The Bubble Bog. Lucia finds a little music box that Denadu threw away. She opens it, and out pops Isaline the ballerina! Isaline says: I'll help you cross the bog!"},
  {name:'Tower Door',icon:'🚪',cls:'w-door',games:['stairs','maze'],
   intro:"There it is! Denadu's tower. Bats fly around the top, and lots of magic stairs go up to the door."},
  {name:"Denadu's Kitchen",icon:'🧙‍♀️',cls:'w-kitchen',games:['pantry','cook'],
   intro:"You're inside! Grumpa is stirring a giant cauldron in a floppy green chef's hat, and Noni is the taste-tester in a giant bib. Denadu put them under a cook-forever spell! Denadu says: Hee hee hee! My soup tastes like old boots, so now Grumpa has to cook for me forever!"}
];
function wLevel(w,only){
  const W=W_WORLDS[w];
  const el=shell(W.cls,only?W_TITLES[only]:W.name); const st=el.querySelector('.stage');
  st.innerHTML=`<div class="area"></div>`;
  show(el);
  const area=st.querySelector('.area'), seq=only?[only]:W.games; let k=0;
  const run=()=>{ const g=seq[k++]; W_GAMES[g](area,()=>{ if(k<seq.length) say('Taz says: Woof! One more here.',()=>T(run,300)); else T(()=>complete(w),300); }); };
  if(!only&&!FREE) say(W.intro,()=>T(run,200)); else run();
}
function witchIntro(){
  const el=h(`<div class="screen intro wintro"><div class="wmoonbig">🌕</div><div class="spacestars"></div><div class="wflyby"><div>${denaduSVG(false,true)}</div><div class="wcarry"><div>${grumpaSVG(false)}</div><div>${noniSVG()}</div></div></div><div class="stage">
<div class="introcast"><div class="wc-ch">${chickieSVG()}</div><div class="wc-lu">${luciaSVG()}</div><div class="wc-em">${emmeGirlSVG()}</div><div class="wc-tz">${tazSVG()}</div><div class="wc-ho">${horsieSVG()}</div><div class="wc-sp">${spenceSVG()}</div></div>
<div class="introtxt">Denadu the witch took Noni and Grumpa!</div><button class="big go">Let's go!</button></div></div>`);
  FREE=false; show(el);
  say("Shh. It's the middle of the night. Chickie wakes Lucia up. Chickie says: Peep peep! I saw a green witch on a broomstick! She swooped down on Noni and Grumpa's house and took them away!",
    ()=>say("Ding dong! Who's at the door? It's Taz, Cousin Jame's dog! His collar has a note from Uncle John and Auntie Heather. It says: We heard Noni and Grumpa are missing. Taz has the best nose in the family. He'll help you!",
    ()=>say("Then Lucia's magic jewel glows, and her stuffies wake up! Horsie, Spence, and Chickie are coming too, and so is your little sister Emmeline. Let's find Noni and Grumpa!")));
  el.querySelector('.go').onclick=()=>{ sfx.tap(); P().seenIntro=true; save(); showMap(); };
}
function witchFinale(){
  const extra=award(5);
  finaleScreen('wfin',`<div class="heartbig">🍝</div>`,
    [[luciaSVG()],[emmeGirlSVG()],[tazSVG(),'wide'],[horsieSVG(),'xwide'],[spenceSVG(),'wide'],[isalineSVG()],[chickieSVG()],[noniSVG()],[grumpaSVG(false),'wide'],[denaduSVG(true),'wide']],
    "You saved Noni and Grumpa! Everyone flies home on Denadu's broom. Even Horsie, and he does not like it one bit! Now Denadu comes to family spaghetti night, and Taz waits under the table for a meatball. Hooray for Lucia!"+(extra?` And Taz gave you a sticker too!`:''),'witch');
}
STORIES.witch={ title:'The Green Witch', short:'🧹 Green Witch',
  coverArt:()=>`<div>${denaduSVG(false,true)}</div><div class="cvtaz">${tazSVG()}</div>`,
  intro:witchIntro, finale:witchFinale, helperSVG:tazSVG, helperName:'Taz', bagSVG:()=>tazSVG(true),
  flyer:()=>`<div class="fa">${horsieSVG()}</div><div class="fm wtz">${tazSVG()}</div>`, mapCls:'witchmap', mapTitle:"The Way to Denadu's Tower",
  mapDecor:`<div class="spacestars"></div><div class="wmoon">🌕</div>`,
  worlds:W_WORLDS.map((W,i)=>({name:W.name,icon:W.icon,pos:[[13,66],[33,40],[53,66],[73,40],[52,13]][i],fly:[['R','-35%'],['L','-85%'],['L','-85%'],['L','-85%'],['R','-50%']][i],go:()=>wLevel(i)})),
  items:[{n:"Noni's Scarf",e:'🧣',say:"Taz found Noni's scarf on a lamp post! It smells just like Noni. He puts it in his backpack."},
    {n:"Grumpa's Recipe Card",e:'📜',say:"The glow-bugs light up the path, and look! Grumpa's spaghetti recipe card fell out of his pocket. Taz puts it in his backpack."},
    {n:"Grumpa's Wooden Spoon",e:'🥄',say:"Isaline found Grumpa's wooden spoon floating on a lily pad! Taz puts it in his backpack."},
    {n:'The Tower Key',e:'🗝️',say:"Chickie brought the tower key back out! Taz puts it in his backpack to keep it safe."}],
  allSay:"Taz has the tower key! Now go into Denadu's kitchen and save Noni and Grumpa!", doneBadge:()=>'🍝',
  lockedLast:"Denadu's kitchen is locked tight. Find all four things first!",
  mapMsg:(p,next,W)=>p.won?'You saved Noni and Grumpa!'
    :p.items.every(Boolean)?"Taz has the tower key! Go into Denadu's kitchen!"
    :p.items.some(Boolean)?`Great job! Horsie will carry you to the ${W[next].name} next. Tap it!`
    :"This is the way to Denadu's tower! Horsie will carry you into the city. Tap it to start!" };
GAMES.witch=W_WORLDS.flatMap((W,w)=>W.games.map(key=>({n:W_TITLES[key],e:W_EMO[key],go:()=>wLevel(w,key)})));
STICKERS.witch=[{n:'Horsie',a:horsieSVG},{n:'Spence',a:spenceSVG},{n:'Isaline',a:isalineSVG},{n:'Chickie',a:chickieSVG},{n:'Denadu',a:()=>denaduSVG(true)},{n:'Taz',a:tazSVG}];


showTitle();
</script>
